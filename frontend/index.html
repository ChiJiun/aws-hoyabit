<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加密市場分析 AI Agent — HOYA BIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<style>
:root{
  --ink:#08080a; --surface:#111114; --card:#17171c; --raised:#1e1e24;
  --line:#26262c; --line-soft:#1d1d22;
  --text:#f4f4f5; --text-dim:#a1a1aa; --muted:#71717a;
  --accent:#f37021; --accent-soft:rgba(243,112,33,.14); --accent-line:rgba(243,112,33,.42);
  --green:#22c55e; --green-soft:rgba(34,197,94,.12);
  --red:#ef4444; --red-soft:rgba(239,68,68,.12);
  --amber:#f59e0b; --amber-soft:rgba(245,158,11,.12);
  --blue:#60a5fa;
  --r:14px; --r-sm:9px; --r-xs:6px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{background:var(--ink);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ============ TOP BAR ============ */
.topbar{position:sticky;top:0;z-index:100;background:rgba(8,8,10,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-main{display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;flex-shrink:0}
.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.brand-name{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.11em;color:var(--accent)}
.topbar-meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
.qtype-badge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;padding:.2rem .5rem;border-radius:var(--r-xs);background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);text-transform:uppercase}
.topbar-actions{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap}
.dl{display:inline-flex;align-items:center;gap:.35rem;font-size:12px;padding:.35rem .7rem;border:1px solid var(--line);border-radius:var(--r-xs);color:var(--text-dim);background:var(--card);transition:.15s}
.dl:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.dl svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.btn-restart{font-family:inherit;font-size:12px;padding:.35rem .7rem;border:1px solid var(--line);border-radius:var(--r-xs);color:var(--text-dim);background:var(--card);cursor:pointer;transition:.15s}
.btn-restart:hover{border-color:var(--accent);color:var(--accent)}
/* anchor nav */
.topnav{display:flex;gap:.15rem;padding:0 1.25rem .5rem;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav a{font-size:12px;color:var(--muted);padding:.3rem .6rem;border-radius:var(--r-xs);white-space:nowrap;border:1px solid transparent}
.topnav a:hover,.topnav a.on{color:var(--accent);background:var(--accent-soft);text-decoration:none}

/* ============ SHELL ============ */
.wrap{max-width:1280px;margin:0 auto;padding:1.5rem 1.25rem 5rem}
section{margin-bottom:1.75rem;scroll-margin-top:100px}
.sec-head{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.85rem;flex-wrap:wrap}
.sec-head h2{font-size:17px;font-weight:700;color:#fff;letter-spacing:.01em}
.sec-head .sec-why{font-size:12.5px;color:var(--muted);line-height:1.5}
.sec-head .count{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:.05rem .45rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-sm);padding:1rem 1.15rem;font-size:13.5px;color:var(--muted)}

/* ============ INPUT ============ */
.intro{max-width:660px;margin:3.5rem auto 2rem;padding:0 1.25rem}
.intro h1{font-size:28px;font-weight:700;letter-spacing:-.01em;margin-bottom:.45rem}
.intro .lede{font-size:15px;color:var(--text-dim);margin-bottom:.6rem;line-height:1.65}
.intro .role{display:inline-block;font-size:12px;color:var(--muted);border-left:2px solid var(--accent);padding-left:.6rem;margin-bottom:1.7rem;line-height:1.6}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem}
.flabel{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.55rem;font-weight:500}
.flabel .hint{text-transform:none;letter-spacing:0;color:#5b5b63;font-size:11.5px}
.coins{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.35rem}
.coin{font-family:var(--mono);font-size:13.5px;font-weight:500;background:var(--ink);color:var(--text-dim);border:1px solid var(--line);border-radius:var(--r-xs);padding:.45rem 1.05rem;cursor:pointer;transition:.15s}
.coin:hover{border-color:var(--muted);color:var(--text)}
.coin[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#0a0a0a;font-weight:600}
.presets{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.preset{font-size:11.5px;background:transparent;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-xs);padding:.25rem .6rem;cursor:pointer;font-family:inherit;transition:.15s}
.preset:hover{border-color:var(--accent);border-style:solid;color:var(--accent)}
textarea{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm);padding:.8rem 1rem;font-family:inherit;font-size:15px;line-height:1.65;resize:vertical;min-height:104px;margin-bottom:1.3rem}
textarea::placeholder{color:#52525b}
textarea:focus{outline:none;border-color:var(--accent)}
.btn-go{width:100%;background:var(--accent);color:#0a0a0a;border:none;border-radius:var(--r-sm);padding:.8rem;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s}
.btn-go:hover:not(:disabled){filter:brightness(1.09)}
.btn-go:disabled{opacity:.4;cursor:not-allowed}

/* ============ LOADING / ERROR ============ */
#loading{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--surface);border-top:1px solid var(--accent-line);padding:.75rem 1.4rem;align-items:center;gap:.85rem}
.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{font-size:13.5px;color:var(--text-dim)}
#elapsed{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:500}
#error{display:none;max-width:660px;margin:1.25rem auto;padding:.9rem 1.15rem;border:1px solid #7f1d1d;border-left-width:3px;border-radius:var(--r-sm);background:#180f11;color:#fca5a5;font-size:13.5px}

/* ============ 1. VERDICT ============ */
.verdict{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr);gap:1rem}
.v-main{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem 1.7rem;position:relative;overflow:hidden}
.v-main::before{content:'';position:absolute;top:-45%;right:-12%;width:300px;height:300px;background:radial-gradient(circle,var(--accent-soft) 0%,transparent 68%);pointer-events:none}
.v-q{font-size:12.5px;color:var(--muted);line-height:1.6;padding-bottom:.8rem;margin-bottom:1rem;border-bottom:1px solid var(--line-soft);position:relative}
.v-q b{color:var(--text-dim);font-weight:500}
.v-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap;position:relative}
.stance{display:inline-flex;align-items:center;gap:.35rem;font-size:12.5px;font-weight:600;padding:.28rem .7rem;border-radius:99px;border:1px solid}
.stance.bullish{color:var(--green);background:var(--green-soft);border-color:rgba(34,197,94,.4)}
.stance.bearish{color:var(--red);background:var(--red-soft);border-color:rgba(239,68,68,.4)}
.stance.neutral{color:var(--text-dim);background:rgba(161,161,170,.1);border-color:var(--line)}
.stance.mixed{color:var(--amber);background:var(--amber-soft);border-color:rgba(245,158,11,.4)}
.v-syms{display:flex;gap:.3rem}
.sym-tag{font-family:var(--mono);font-size:12px;font-weight:600;padding:.25rem .55rem;border-radius:var(--r-xs);background:var(--raised);border:1px solid var(--line);color:var(--text)}
.v-text{font-size:20px;font-weight:600;line-height:1.55;color:#fff;position:relative}
.v-invalid{margin-top:1.15rem;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--r-sm);padding:.8rem 1rem;position:relative}
.v-invalid .lbl{font-size:11px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem;display:flex;align-items:center;gap:.3rem}
.v-invalid p{font-size:13.5px;color:var(--text-dim);line-height:1.6}
.v-side{display:flex;flex-direction:column;gap:.75rem}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;flex:1;justify-content:center}
.ring{position:relative;width:104px;height:104px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
.ring .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ring .txt .n{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--accent);line-height:1}
.ring .txt .u{font-size:10px;color:var(--muted)}
.gauge .g-lbl{font-size:12.5px;color:var(--muted);text-align:center}
.gauge .g-lbl strong{color:var(--text);font-weight:600}
.disclaimer{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:.7rem .85rem;font-size:11.5px;color:var(--muted);line-height:1.55;display:flex;gap:.45rem}
.disclaimer .ic{color:var(--accent);flex-shrink:0}

/* ============ 2. SIGNALS ============ */
.sig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:.85rem}
.sig{background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:var(--r-sm);padding:1.05rem 1.2rem}
.sig.red{border-left-color:var(--red)}
.sig.yellow{border-left-color:var(--amber)}
.sig-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
.sig-lvl{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.07em;padding:.15rem .42rem;border-radius:3px;text-transform:uppercase}
.sig.red .sig-lvl{background:var(--red-soft);color:var(--red)}
.sig.yellow .sig-lvl{background:var(--amber-soft);color:var(--amber)}
.sig-title{font-size:14.5px;font-weight:600;color:#fff}
.sig-detail{font-size:13.5px;color:var(--text-dim);line-height:1.65;margin-bottom:.6rem}
.sig-metrics{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.6rem}
.mrow{font-size:12px}
.mrow-top{display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.25rem}
.mrow-top .ml{color:var(--muted)}
.mrow-top .mv{font-family:var(--mono);color:var(--text);font-weight:500}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pbar.hi i{background:var(--red)}
.sig-caveat{font-size:12px;color:var(--muted);background:var(--card);border-radius:var(--r-xs);padding:.5rem .65rem;line-height:1.55;margin-bottom:.55rem}
.sig-caveat b{color:var(--text-dim);font-weight:500}

/* evidence chips */
.chips{display:flex;gap:.3rem;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;padding:.2rem .45rem;border-radius:3px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);cursor:pointer;font-weight:500;transition:.15s}
.chip:hover{background:var(--accent);color:#0a0a0a}
.chip:disabled{opacity:.5;cursor:default;background:var(--raised);color:var(--muted);border-color:var(--line)}

/* checked normal */
.normal-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:1rem 1.2rem;margin-top:.85rem}
.normal-box .nb-head{font-size:12.5px;color:var(--text-dim);margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem}
.normal-box .nb-head .ic{color:var(--green)}
.normal-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.35rem .9rem}
.normal-list li{list-style:none;font-size:12.5px;color:var(--muted);padding-left:1.1rem;position:relative;line-height:1.6}
.normal-list li::before{content:'✓';position:absolute;left:0;color:var(--green);font-size:11px}

/* ============ 3. DIMENSIONS ============ */
.dim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.85rem}
.dim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:1.05rem 1.2rem;transition:.18s}
.dim.na{opacity:.62;border-style:dashed}
.dim-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.dim-name{font-size:14.5px;font-weight:600;color:#fff}
.pill{font-size:10.5px;font-weight:600;padding:.16rem .5rem;border-radius:99px;border:1px solid;white-space:nowrap}
.pill.strong{color:var(--green);background:var(--green-soft);border-color:rgba(34,197,94,.35)}
.pill.weak{color:var(--red);background:var(--red-soft);border-color:rgba(239,68,68,.35)}
.pill.neutral{color:var(--text-dim);background:rgba(161,161,170,.1);border-color:var(--line)}
.pill.na{color:var(--muted);background:transparent;border-color:var(--line)}
.dim-head{font-size:13.5px;color:var(--text-dim);line-height:1.65;margin-bottom:.65rem}
.dim-sym{border-top:1px solid var(--line-soft);padding-top:.55rem;margin-top:.55rem}
.dim-sym-name{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);margin-bottom:.3rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .6rem;font-size:12px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{font-family:var(--mono);color:var(--text);text-align:right}

/* ============ 4. TYPED BLOCKS ============ */
.hyp-stmt{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r-sm);padding:1rem 1.2rem;margin-bottom:.85rem}
.hyp-stmt .lbl{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.hyp-stmt p{font-size:15px;color:#fff;font-weight:500;line-height:1.6}
.hyp-cols{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;margin-bottom:.85rem}
.hcol{background:var(--surface);border:1px solid var(--line);border-top-width:3px;border-radius:var(--r-sm);padding:1rem 1.15rem}
.hcol.sup{border-top-color:var(--green)}
.hcol.opp{border-top-color:var(--red)}
.hcol.neu{border-top-color:var(--muted)}
.hcol.ins{border-top-color:var(--amber)}
.hcol h3{font-size:13px;font-weight:600;margin-bottom:.6rem;display:flex;align-items:center;gap:.35rem}
.hcol.sup h3{color:var(--green)}
.hcol.opp h3{color:var(--red)}
.hcol.neu h3{color:var(--text-dim)}
.hcol.ins h3{color:var(--amber)}
.hcol h3 .n{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:500}
.hpt{font-size:13px;color:var(--text-dim);line-height:1.6;padding:.5rem 0;border-bottom:1px solid var(--line-soft)}
.hpt:last-child{border-bottom:none}
.hpt-meta{display:flex;align-items:center;gap:.4rem;margin-top:.3rem;flex-wrap:wrap}
.str{font-family:var(--mono);font-size:9.5px;padding:.1rem .35rem;border-radius:3px;background:var(--raised);color:var(--muted);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.str.strong{color:var(--text);border-color:var(--muted)}
.hyp-reason{background:var(--card);border:1px solid var(--accent-line);border-left-width:3px;border-radius:var(--r-sm);padding:1rem 1.2rem}
.hyp-reason .lbl{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.hyp-reason p{font-size:13.5px;color:var(--text);line-height:1.7}

.cmp-wrap{overflow-x:auto;margin-bottom:.85rem;border:1px solid var(--line);border-radius:var(--r-sm)}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.cmp th,table.cmp td{padding:.65rem .9rem;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.cmp thead th{background:var(--card);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500;position:sticky;top:0}
table.cmp tbody tr:last-child td{border-bottom:none}
table.cmp .dimcol{font-weight:500;color:#fff;white-space:nowrap}
table.cmp td.win{background:var(--accent-soft)}
table.cmp .cv{font-family:var(--mono);color:var(--text);display:block}
table.cmp .cd{font-size:11.5px;color:var(--muted);display:block;margin-top:.15rem;line-height:1.5}
.edge{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:.14rem .42rem;border-radius:3px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.edge.tie{background:var(--raised);color:var(--muted);border-color:var(--line)}
.prefer{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:1rem 1.15rem}
.pbox h4{font-size:12.5px;font-weight:600;color:var(--accent);margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.pbox p{font-size:13px;color:var(--text-dim);line-height:1.65}

/* consistency matrix (single_integration) */
.consist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.85rem}
.cgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:1rem 1.15rem}
.cgroup h4{font-size:12.5px;font-weight:600;margin-bottom:.55rem;display:flex;align-items:center;gap:.35rem}
.cgroup.agree h4{color:var(--green)}
.cgroup.diverge h4{color:var(--amber)}
.cgroup.gap h4{color:var(--muted)}
.cgroup li{list-style:none;font-size:12.5px;color:var(--text-dim);line-height:1.6;padding:.3rem 0;border-bottom:1px solid var(--line-soft)}
.cgroup li:last-child{border-bottom:none}
.cgroup li .dn{font-weight:500;color:var(--text)}

/* ============ 5. CHARTS ============ */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:.85rem}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:1.05rem 1.2rem}
.chart-card h3{font-size:13.5px;font-weight:600;color:#fff;margin-bottom:.15rem}
.chart-card .cmeta{font-size:11.5px;color:var(--muted);margin-bottom:.7rem;font-family:var(--mono)}
.chart-box{position:relative;height:210px}

/* ============ 6. REASONING ============ */
.reason{display:flex;flex-direction:column;gap:.6rem}
.rstep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:1.1rem 1.3rem;position:relative}
.rstep::before{content:'';position:absolute;left:0;top:1.3rem;bottom:1.3rem;width:3px;border-radius:2px}
.rstep.fact::before{background:var(--blue)}
.rstep.infer::before{background:var(--accent)}
.rstep.calib::before{background:var(--amber)}
.rstep-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap}
.rstep-n{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;padding:.15rem .45rem;border-radius:3px;text-transform:uppercase}
.rstep.fact .rstep-n{background:rgba(96,165,250,.14);color:var(--blue)}
.rstep.infer .rstep-n{background:var(--accent-soft);color:var(--accent)}

.prose{font-size:13.8px;color:var(--text-dim);line-height:1.8}
.prose h1,.prose h2,.prose h3,.prose h4{color:#fff;margin:1rem 0 .45rem;line-height:1.4}
.prose h1{font-size:17px}.prose h2{font-size:15.5px}.prose h3{font-size:14px}.prose h4{font-size:13px}
.prose p{margin-bottom:.7rem}
.prose ul,.prose ol{margin:0 0 .7rem 1.15rem}

.prose blockquote{border-left:2px solid var(--line);padding-left:.8rem;color:var(--muted);margin-bottom:.7rem}
.prose hr{border:none;border-top:1px solid var(--line);margin:1rem 0}
.prose a{word-break:break-all}

/* ============ 7. EVIDENCE ============ */
.ev-tools{display:flex;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap;align-items:center}
.ev-search{flex:1;min-width:200px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-xs);padding:.45rem .7rem;color:var(--text);font-family:inherit;font-size:13px}
.ev-search:focus{outline:none;border-color:var(--accent)}
.ev-count{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ev-list{display:flex;flex-direction:column;gap:.5rem}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:.9rem 1.1rem;transition:.2s}
.ev.hit{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-line),0 0 22px var(--accent-soft)}
.ev-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;flex-wrap:wrap}
.ev-id{font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:.15rem .42rem;border-radius:3px;border:1px solid var(--accent-line)}
.ev-time{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto}
.ev-claim{font-size:13.5px;color:var(--text);line-height:1.6;margin-bottom:.45rem}

details.ref{margin-top:.35rem}

/* ============ 8. COVERAGE ============ */
.cov{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,2fr);gap:.85rem}

.cov-lists{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.cov-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:1rem 1.15rem}

/* ============ 9. WATCHLIST ============ */
.watch{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.85rem}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:1rem 1.15rem}
.wcard .wd{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:.25rem}
.wcard .we{font-size:14px;font-weight:600;color:#fff;margin-bottom:.35rem;line-height:1.5}

/* ============ 10. RAW ============ */
details.big{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:.6rem}
details.big>summary{padding:.9rem 1.2rem;cursor:pointer;font-size:14px;font-weight:500;color:var(--text);list-style:none;display:flex;align-items:center;gap:.45rem}
details.big>summary::-webkit-details-marker{display:none}
details.big>summary::before{content:'▸';color:var(--accent);font-size:11px;transition:transform .15s}
details.big[open]>summary::before{transform:rotate(90deg)}
details.big>summary .sn{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;font-weight:400}

.logs{display:flex;flex-direction:column;gap:.2rem;font-family:var(--mono);font-size:11.5px;max-height:440px;overflow-y:auto}
.logrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:.6rem;align-items:baseline;padding:.35rem .5rem;border-radius:var(--r-xs);border-left:2px solid transparent}
.logrow:nth-child(odd){background:var(--card)}
.logrow.ok{border-left-color:var(--green)}
.logrow.bad{border-left-color:var(--red)}
.logrow .lt{color:var(--muted)}
.logrow .ls{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.logrow.ok .ls{color:var(--green)}
.logrow.bad .ls{color:var(--red)}

.logrow .lnote{color:var(--muted);font-size:10.5px;grid-column:3;word-break:break-word}

/* ============ RESPONSIVE ============ */
@media(max-width:1000px){
  .verdict{grid-template-columns:1fr}
  .cov{grid-template-columns:1fr}
}

  <p class="role">這是資訊提煉工具，不提供投資建議。我們讓你看清楚訊號與雜訊的差別，決定權在你。</p>
  <div class="panel">

<script>
/* =========================================================================
   加密市場分析 AI Agent — 前端渲染
   資料來源：C5 HTTP 回應 + C7 report_data
   原則：所有數值來自後端，前端不做任何指標計算
   ========================================================================= */
'use strict';

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const API_URL = IS_LOCAL
  ? `${location.origin}/api`
  : 'https://請填入你的-function-url.lambda-url.us-west-2.on.aws/';
const DEMO_MODE = location.protocol === 'file:';

const PROGRESS = [
  '正在判別題型與規劃蒐集範圍',
  '正在並行預抓多源資料（Phase A）',
  '正在讀取價格與計算技術指標',
  '正在檢索新聞、公告與鏈上活躍度',
  '正在交叉比對各來源訊號',
  '正在偵測異常與背離',
  '正在收斂結論並整理證據'
];

const PRESETS = [
  { label: '多源整合', coins: 1, text: '分析該幣種過去兩週的市場表現，整合價格走勢、鏈上活躍度、主要新聞事件與社群討論熱度，給出整體市場狀態判斷，並說明各類資料之間的一致程度。' },
  { label: '假設驗證', coins: 1, text: '市場上有聲音認為該幣種短期內將維持盤整、缺乏明確方向，請蒐集支持與反對此觀點的證據，並說明你最終的判斷與理由。' },
  { label: '比較分析', coins: 2, text: '比較這兩個幣種在當前宏觀環境下各自的市場位置與風險特徵，說明兩者在流動性、市場關注度或風險敞口上的主要差異，以及在什麼條件下各自更值得優先關注。' }
];

const QTYPE_LABEL = {
  single_integration: '多源整合',
  hypothesis: '假設驗證',
  comparison: '比較分析'
};
const STANCE = {
  bullish: { label: '偏多', icon: '▲' },
  bearish: { label: '偏空', icon: '▼' },
  neutral: { label: '中性', icon: '■' },
  mixed: { label: '訊號分歧', icon: '◆' }
};
const STATE = {
  strong: '偏強', weak: '偏弱', neutral: '中性', na: '無資料'
};
const SERIES_META = {
  price: { title: '價格走勢', unit: 'USD', fmt: 'usd' },
  volume: { title: '成交量', unit: '', fmt: 'compact', type: 'bar' },
  fear_greed: { title: '恐懼貪婪指數', unit: '0–100', fmt: 'int' },
  funding_rate: { title: '資金費率', unit: '/8h', fmt: 'pct4' },
  tvl: { title: 'DeFi TVL', unit: 'USD', fmt: 'usd' },
  relative_strength: { title: '相對強弱', unit: '', fmt: 'num' },
  correlation_30d: { title: '30 日相關係數', unit: '', fmt: 'num' },
  open_interest: { title: '未平倉量', unit: 'USD', fmt: 'usd' }
};

/* ---- state ---- */
let selected = [];
let tick = null, msgTick = null, secs = 0, msgIdx = 0;
let evidenceList = [];
let charts = [];

/* ---- DOM ---- */
const $ = id => document.getElementById(id);

/* =========================================================================
   helpers
   ========================================================================= */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function num(v) {
  const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[$,%\s]/g, ''));
  return Number.isFinite(n) ? n : null;
}

function fmt(v, kind) {
  const n = num(v);
  if (n === null) return esc(v ?? '--');
  switch (kind) {
    case 'usd': return '$' + compact(n);
    case 'compact': return compact(n);
    case 'int': return Math.round(n).toLocaleString('zh-TW');
    case 'pct4': return (n * 100).toFixed(4).replace(/0+$/, '').replace(/\.$/, '') + '%';
    case 'num': return n.toLocaleString('zh-TW', { maximumFractionDigits: 4 });
    default: return n.toLocaleString('zh-TW', { maximumFractionDigits: 2 });
  }
}

function compact(n) {
  return new Intl.NumberFormat('zh-TW', {
    notation: Math.abs(n) >= 10000 ? 'compact' : 'standard',
    maximumFractionDigits: 2
  }).format(n);
}

function shortId(id) {
  const s = String(id ?? '');
  return s.length > 14 ? s.slice(0, 11) + '…' : s;
}

/** 人類可讀的來源標籤：API host 或網址標題 */
function sourceLabel(src) {
  const s = String(src ?? '').trim();
  if (!s) return '未知來源';
  try {
    if (/^https?:\/\//i.test(s)) return new URL(s).hostname.replace(/^www\./, '');
  } catch (e) { /* 非合法 URL，退回原字串 */ }
  return s;
}

/** 從 content_reference 撈出可點擊的人類查證連結 */
function verifyLinks(ref) {
  const out = [];
  const seen = new Set();
  const add = (url, title) => {
    if (!url || typeof url !== 'string' || !/^https?:\/\//i.test(url)) return;
    if (seen.has(url)) return;
    seen.add(url);
    out.push({ url, title: title || sourceLabel(url) });
  };
  if (!ref || typeof ref !== 'object') return out;
  add(ref.human_url, '互動資料頁');
  (Array.isArray(ref.human_urls) ? ref.human_urls : []).forEach(h => {
    if (h && typeof h === 'object') add(h.url, h.label);
  });
  (Array.isArray(ref.verification_urls) ? ref.verification_urls : []).forEach(h => {
    if (h && typeof h === 'object') add(h.url, h.title);
  });
  (Array.isArray(ref.items) ? ref.items : []).slice(0, 5).forEach(it => {
    if (it && typeof it === 'object') add(it.url, it.title);
  });
  return out.slice(0, 6);
}

/** hypothesis 的 supporting/opposing 可能是字串陣列或物件陣列，統一形狀 */
function normPoints(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(it => {
    if (typeof it === 'string') return { text: it, strength: '', ids: [] };
    if (it && typeof it === 'object') {
      return {
        text: it.point || it.text || it.reason || '',
        strength: it.strength || '',
        ids: Array.isArray(it.evidence_ids) ? it.evidence_ids : []
      };
    }
    return { text: String(it ?? ''), strength: '', ids: [] };
  }).filter(p => p.text);
}

/** comparison 的 a/b 可能是 {} 或 {value, detail}，統一取值 */
function cell(side) {
  if (!side || typeof side !== 'object') return { value: '', detail: '' };
  return { value: side.value ?? '', detail: side.detail ?? '' };
}

/* =========================================================================
   輸入流程
   ========================================================================= */
function initInput() {
  document.querySelectorAll('#coins-group .coin').forEach(btn => {
    btn.addEventListener('click', () => {
      const sym = btn.textContent.trim();
      if (btn.getAttribute('aria-pressed') === 'true') {
        btn.setAttribute('aria-pressed', 'false');
        selected = selected.filter(s => s !== sym);
      } else {
        if (selected.length >= 2) {
          const drop = selected.shift();
          const old = [...document.querySelectorAll('#coins-group .coin')]
            .find(b => b.textContent.trim() === drop);
          if (old) old.setAttribute('aria-pressed', 'false');
        }
        selected.push(sym);
        btn.setAttribute('aria-pressed', 'true');
      }
    });
  });

  $('presets').innerHTML = PRESETS
    .map((p, i) => `<button class="preset" type="button" data-i="${i}">${esc(p.label)}</button>`)
    .join('');
  $('presets').addEventListener('click', e => {
    const btn = e.target.closest('.preset');
    if (!btn) return;
    $('question').value = PRESETS[+btn.dataset.i].text;
    $('question').focus();
  });

  $('btn-go').addEventListener('click', run);
  $('btn-restart').addEventListener('click', () => location.reload());

  if (DEMO_MODE) {
    const first = document.querySelector('#coins-group .coin');
    if (first) { first.setAttribute('aria-pressed', 'true'); selected = ['BTC']; }
    $('question').value = PRESETS[0].text;
  }
}

function showError(msg) {
  stopTimers();
  $('loading').style.display = 'none';
  $('view-input').hidden = false;
  $('btn-go').disabled = false;
  const el = $('error');
  el.textContent = msg;
  el.style.display = 'block';
}

function stopTimers() {
  clearInterval(tick); clearInterval(msgTick);
  tick = null; msgTick = null;
}

function startLoading() {
  $('error').style.display = 'none';
  $('view-input').hidden = true;
  $('view-result').hidden = true;
  $('btn-go').disabled = true;
  $('loading').style.display = 'flex';
  secs = 0; msgIdx = 0;
  $('elapsed').textContent = '00:00';
  $('loading-msg').textContent = PROGRESS[0];
  tick = setInterval(() => {
    secs++;
    const m = String(Math.floor(secs / 60)).padStart(2, '0');
    const s = String(secs % 60).padStart(2, '0');
    $('elapsed').textContent = `${m}:${s}`;
  }, 1000);
  msgTick = setInterval(() => {
    msgIdx = (msgIdx + 1) % PROGRESS.length;
    $('loading-msg').textContent = PROGRESS[msgIdx];
  }, 9000);
}

async function run() {
  $('error').style.display = 'none';
  if (!selected.length) return showError('請至少選擇一個幣種。');
  const q = $('question').value.trim();
  if (!q) return showError('請輸入分析題目。');

  startLoading();
  try {
    const data = DEMO_MODE
      ? await loadFixture(q)
      : await callApi(q);
    evidenceList = await loadEvidence(data);
    render(data, { symbols: [...selected], question: q });
  } catch (err) {
    showError(err && err.message ? err.message : '無法連線到分析服務。');
  }
}

async function callApi(question) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ symbols: [...selected], question })
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `分析服務回傳錯誤 ${res.status}`);
  }
  return res.json();
}

/** file:// 離線 demo：載入對應題型的 C7 fixture */
async function loadFixture(question) {
  const isHypo = selected.length === 1 && /認為|觀點|驗證|假設|是否|有人說/.test(question);
  const path = selected.length === 2
    ? 'fixtures/c7_comparison.json'
    : (isHypo ? 'fixtures/c7_hypothesis.json' : 'fixtures/c7_single_integration.json');
  let rd = null;
  try {
    const r = await fetch(path);
    if (r.ok) rd = await r.json();
  } catch (e) { /* fixture 不可用時降級為純文字 */ }
  await new Promise(r => setTimeout(r, 1200));
  return {
    run_id: 'demo_offline',
    report_text: '# 離線示範\n\n此頁面以 `file://` 開啟，顯示的是 `frontend/fixtures/` 的範例 C7 資料，並非真實分析結果。\n\n若要看完整流程，請執行 `python local_server.py` 後開啟 http://localhost:8080。',
    report_data: rd,
    evidence_download_url: '',
    log_download_url: ''
  };
}

/** 證據清單：優先用回應內嵌，否則抓下載連結 */
async function loadEvidence(data) {
  if (Array.isArray(data.evidence_list)) return data.evidence_list;
  const url = data.evidence_download_url;
  if (!url || url === '#') return [];
  $('loading-msg').textContent = '正在載入證據清單';
  try {
    const res = await fetch(new URL(url, location.href));
    if (!res.ok) return [];
    const payload = await res.json();
    return Array.isArray(payload) ? payload : [];
  } catch (e) {
    return [];
  }
}

/* =========================================================================
   渲染主流程
   ========================================================================= */
function render(data, req) {
  stopTimers();
  $('loading').style.display = 'none';
  $('btn-go').disabled = false;

  const rd = data.report_data && typeof data.report_data === 'object' ? data.report_data : null;
  const reportText = data.report_text || '';
  const qtype = (rd && rd.question_type) || inferType(req);
  const symbols = (rd && Array.isArray(rd.symbols) && rd.symbols.length) ? rd.symbols : req.symbols;

  /* 頂部列 */
  $('topbar').hidden = false;
  $('hdr-qtype').textContent = QTYPE_LABEL[qtype] || qtype;
  $('hdr-run').textContent = data.run_id ? `RUN ${data.run_id}` : '';
  $('hdr-elapsed').textContent = `耗時 ${$('elapsed').textContent}`;
  setDownload('dl-ev', data.evidence_download_url);
  setDownload('dl-log', data.log_download_url);
  setReportDownload(reportText);

  /* 章節組裝：C7 缺失時只渲染可用區塊，不阻斷交付 */
  const blocks = [];
  const nav = [];
  const add = (id, label, html) => {
    if (!html) return;
    blocks.push(html);
    nav.push({ id, label });
  };

  add('sec-verdict', '判斷', secVerdict(rd, req, symbols, qtype));
  add('sec-signals', '異常訊號', secSignals(rd));
  add('sec-dimensions', '分析維度', secDimensions(rd, symbols));
  add('sec-typed', QTYPE_LABEL[qtype] || '專屬分析', secTyped(rd, qtype, symbols));
  add('sec-charts', '圖表', secCharts(rd));
  add('sec-reasoning', '推理鏈', secReasoning(reportText));
  add('sec-evidence', '證據溯源', secEvidence());
  add('sec-coverage', '資料覆蓋', secCoverage(rd));
  add('sec-watchlist', '後續觀察', secWatchlist(rd));
  add('sec-raw', '原始交付物', secRaw(reportText, rd));

  if (!blocks.length) {
    blocks.push(`<section><div class="prose">${mdToHtml(reportText)}</div></section>`);
  }

  $('view-result').innerHTML = blocks.join('');
  $('view-result').hidden = false;
  $('topnav').innerHTML = nav
    .map(n => `<a href="#${n.id}">${esc(n.label)}</a>`).join('');

  /* 渲染後互動綁定 */
  drawCharts(rd);
  bindChips();
  bindEvidenceSearch();
  observeNav(nav.map(n => n.id));
  loadLog(data.log_download_url);
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function inferType(req) {
  if (req.symbols.length === 2) return 'comparison';
  return /認為|觀點|驗證|假設|是否|有人說/.test(req.question) ? 'hypothesis' : 'single_integration';
}

function setDownload(id, url) {
  const el = $(id);
  if (url && url !== '#') {
    el.href = url;
    el.hidden = false;
  } else {
    el.hidden = true;
  }
}

/** report.md 以 blob 提供下載，確保交付物可離線保存 */
function setReportDownload(text) {
  const el = $('dl-report');
  if (!text) { el.hidden = true; return; }
  el.hidden = false;
  el.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
}

function head(title, why, count) {
  return `<div class="sec-head"><h2>${esc(title)}</h2>` +
    (count !== undefined && count !== null ? `<span class="count">${esc(count)}</span>` : '') +
    (why ? `<span class="sec-why">${esc(why)}</span>` : '') +
    `</div>`;
}

/* =========================================================================
   1. 判斷
   ========================================================================= */
function secVerdict(rd, req, symbols, qtype) {
  const v = (rd && rd.verdict) || null;
  const stanceKey = v && STANCE[v.stance] ? v.stance : 'neutral';
  const st = STANCE[stanceKey];
  const conf = v && Number.isFinite(v.confidence) ? v.confidence : null;
  const pct = conf === null ? null : Math.round(conf * 100);
  const CIRC = 2 * Math.PI * 46;
  const dash = pct === null ? CIRC : CIRC * (1 - pct / 100);

  const verdictText = v && v.text
    ? esc(v.text)
    : '<span style="color:var(--muted)">模型未輸出結構化判斷，請參閱下方推理鏈與完整報告。</span>';

  return `<section id="sec-verdict">
  <div class="verdict">
    <div class="v-main">
      <p class="v-q"><b>分析題目</b>：${esc(req.question)}</p>
      <div class="v-row">
        <span class="stance ${stanceKey}"><span aria-hidden="true">${st.icon}</span>${esc(st.label)}</span>
        <span class="v-syms">${symbols.map(s => `<span class="sym-tag">${esc(s)}</span>`).join('')}</span>
        <span class="qtype-badge">${esc(QTYPE_LABEL[qtype] || qtype)}</span>
      </div>
      <p class="v-text">${verdictText}</p>
      ${v && v.invalidation ? `<div class="v-invalid">
        <p class="lbl"><span aria-hidden="true">⚠</span>什麼情況會推翻這個判斷</p>
        <p>${esc(v.invalidation)}</p>
      </div>` : ''}
    </div>
    <div class="v-side">
      <div class="gauge">
        <div class="ring">
          <svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
            <circle class="bg" cx="52" cy="52" r="46"></circle>
            <circle class="fg" cx="52" cy="52" r="46"
              stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${dash.toFixed(1)}"></circle>
          </svg>
          <div class="txt">
            <span class="n">${pct === null ? '--' : pct}</span>
            <span class="u">${pct === null ? '' : '/ 100'}</span>
          </div>
        </div>
        <p class="g-lbl">判斷信心${v && v.confidence_label ? `：<strong>${esc(v.confidence_label)}</strong>` : ''}
          <br><span style="font-size:11.5px">依證據品質與一致程度校準</span></p>
      </div>
      <div class="disclaimer">
        <span class="ic" aria-hidden="true">◆</span>
        <span>本系統為資訊提煉工具，僅整合公開資料並標示訊號與限制，<b>不提供任何投資建議</b>、進出場時機或目標價。</span>
      </div>
    </div>
  </div>
</section>`;
}

/* =========================================================================
   2. 異常訊號 + 已檢查正常
   ========================================================================= */
function secSignals(rd) {
  if (!rd) return '';
  const signals = Array.isArray(rd.signals) ? rd.signals : [];
  const normal = Array.isArray(rd.checked_normal) ? rd.checked_normal : [];
  if (!signals.length && !normal.length) return '';

  const order = { red: 0, yellow: 1 };
  const sorted = [...signals].sort((a, b) => (order[a.level] ?? 9) - (order[b.level] ?? 9));

  const cards = sorted.map(s => {
    const lvl = s.level === 'red' ? 'red' : 'yellow';
    const metrics = (Array.isArray(s.metrics) ? s.metrics : []).map(m => {
      const p = num(m.percentile);
      const hi = p !== null && (p >= 80 || p <= 20);
      return `<div class="mrow">
        <div class="mrow-top"><span class="ml">${esc(m.label ?? '')}</span>
        <span class="mv">${fmt(m.value, 'auto')}${p !== null ? ` · P${Math.round(p)}` : ''}</span></div>
        ${p !== null ? `<div class="pbar${hi ? ' hi' : ''}"><i style="width:${Math.max(2, Math.min(100, p))}%"></i></div>` : ''}
      </div>`;
    }).join('');

    return `<article class="sig ${lvl}">
      <div class="sig-top">
        <span class="sig-lvl">${lvl === 'red' ? '強烈異常' : '值得注意'}</span>
        <h3 class="sig-title">${esc(s.title ?? '')}</h3>
      </div>
      ${s.detail ? `<p class="sig-detail">${esc(s.detail)}</p>` : ''}
      ${metrics ? `<div class="sig-metrics">${metrics}</div>` : ''}
      ${s.caveat ? `<p class="sig-caveat"><b>注意</b>：${esc(s.caveat)}</p>` : ''}
      ${chips(s.evidence_ids)}
    </article>`;
  }).join('');

  const signalBody = signals.length
    ? `<div class="sig-grid">${cards}</div>`
    : `<div class="empty">本次掃描未偵測到達門檻的異常訊號。這是有意義的結果：代表各項指標都落在常態範圍內，而非我們沒有檢查。</div>`;

  const normalBody = normal.length ? `<div class="normal-box">
    <p class="nb-head"><span class="ic" aria-hidden="true">✓</span>已檢查並確認落在常態範圍（用來證明上方異常是全面掃描後的結果，不是挑選出來的）</p>
    <ul class="normal-list">${normal.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
  </div>` : '';

  return `<section id="sec-signals">
    ${head('異常訊號', '主動標出偏離常態之處：歷史極端百分位、跨來源背離、量價異常', signals.length || 0)}
    ${signalBody}${normalBody}
  </section>`;
}

function chips(ids) {
  const list = Array.isArray(ids) ? ids.filter(Boolean) : [];
  if (!list.length) return '';
  return `<div class="chips">${list.map(id => {
    const known = evidenceList.some(e => e && e.evidence_id === id);
    return `<button class="chip" type="button" data-ev="${esc(id)}"${known ? '' : ' disabled'}
      title="${known ? '跳到證據明細' : '證據清單未載入'}">${esc(shortId(id))}</button>`;
  }).join('')}</div>`;
}

/* =========================================================================
   3. 分析維度
   ========================================================================= */
function secDimensions(rd, symbols) {
  if (!rd) return '';
  const dims = Array.isArray(rd.dimensions) ? rd.dimensions : [];
  if (!dims.length) return '';

  const cards = dims.map(d => {
    const state = STATE[d.state] ? d.state : 'neutral';
    const per = d.per_symbol && typeof d.per_symbol === 'object' ? d.per_symbol : null;
    let perHtml = '';
    if (per) {
      perHtml = Object.entries(per).map(([sym, metrics]) => {
        if (!metrics || typeof metrics !== 'object') return '';
        const rows = Object.entries(metrics)
          .filter(([, v]) => v !== null && v !== undefined && typeof v !== 'object')
          .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${fmt(v, 'auto')}</dd>`)
          .join('');
        if (!rows) return '';
        return `<div class="dim-sym"><p class="dim-sym-name">${esc(sym)}</p><dl class="kv">${rows}</dl></div>`;
      }).join('');
    }
    return `<article class="dim${state === 'na' ? ' na' : ''}">
      <div class="dim-top">
        <h3 class="dim-name">${esc(d.name ?? '')}</h3>
        <span class="pill ${state}">${esc(STATE[state])}</span>
      </div>
      ${d.headline ? `<p class="dim-head">${esc(d.headline)}</p>` : ''}
      ${perHtml}
      ${chips(d.evidence_ids)}
    </article>`;
  }).join('');

  const naCount = dims.filter(d => d.state === 'na').length;
  const why = symbols.length === 2
    ? '每個維度在兩個幣種間以相同口徑比較'
    : '跨價格、鏈上、衍生品、情緒、總經多個維度整合，無資料的維度會明確標示原因';

  return `<section id="sec-dimensions">
    ${head('分析維度', why, `${dims.length} 項${naCount ? `・${naCount} 項無資料` : ''}`)}
    <div class="dim-grid">${cards}</div>
  </section>`;
}

/* =========================================================================
   4. 題型專屬區塊
   ========================================================================= */
function secTyped(rd, qtype, symbols) {
  if (!rd) return '';
  if (qtype === 'hypothesis') return secHypothesis(rd);
  if (qtype === 'comparison') return secComparison(rd, symbols);
  return secConsistency(rd);
}

function secHypothesis(rd) {
  const h = rd.hypothesis;
  if (!h || typeof h !== 'object') return '';
  const sup = normPoints(h.supporting);
  const opp = normPoints(h.opposing);
  const neu = normPoints(h.neutral);
  const ins = normPoints(h.insufficient);
  if (!h.statement && !sup.length && !opp.length && !h.verdict_reason) return '';

  const col = (cls, title, icon, pts, showStrength) => {
    if (!pts.length) return '';
    return `<div class="hcol ${cls}">
      <h3><span aria-hidden="true">${icon}</span>${esc(title)}<span class="n">${pts.length}</span></h3>
      ${pts.map(p => `<div class="hpt">${esc(p.text)}
        ${(showStrength && p.strength) || p.ids.length ? `<div class="hpt-meta">
          ${showStrength && p.strength ? `<span class="str${p.strength === 'strong' ? ' strong' : ''}">${esc(p.strength)}</span>` : ''}
          ${chips(p.ids)}
        </div>` : ''}
      </div>`).join('')}
    </div>`;
  };

  return `<section id="sec-typed">
    ${head('假設檢驗', '同時蒐集支持與反對證據，並說明權衡依據')}
    ${h.statement ? `<div class="hyp-stmt">
      <p class="lbl">被檢驗的假設</p><p>${esc(h.statement)}</p>
    </div>` : ''}
    ${h.indeterminate ? `<div class="empty">證據不足以對此假設做出方向性判定，以下列出已取得的正反證據供自行判斷。</div>` : ''}
    <div class="hyp-cols">
      ${col('sup', '支持證據', '＋', sup, true)}
      ${col('opp', '反對證據', '−', opp, true)}
    </div>
    ${(neu.length || ins.length) ? `<div class="hyp-cols">
      ${col('neu', '中性／尚未定價', '○', neu, false)}
      ${col('ins', '資料不足', '?', ins, false)}
    </div>` : ''}
    ${h.verdict_reason ? `<div class="hyp-reason">
      <p class="lbl">判定理由</p><p>${esc(h.verdict_reason)}</p>
    </div>` : ''}
  </section>`;
}

function secComparison(rd, symbols) {
  const c = rd.comparison;
  if (!c || typeof c !== 'object') return '';
  const rows = Array.isArray(c.rows) ? c.rows : [];
  if (!rows.length && !c.when_prefer_a && !c.when_prefer_b) return '';
  const [a, b] = [symbols[0] ?? 'A', symbols[1] ?? 'B'];

  const body = rows.map(r => {
    const ca = cell(r.a), cb = cell(r.b);
    const edge = String(r.edge ?? '').toUpperCase();
    const tdA = `<td class="${edge === 'A' ? 'win' : ''}">
      ${ca.value ? `<span class="cv">${esc(ca.value)}</span>` : '<span class="cv" style="color:var(--muted)">--</span>'}
      ${ca.detail ? `<span class="cd">${esc(ca.detail)}</span>` : ''}</td>`;
    const tdB = `<td class="${edge === 'B' ? 'win' : ''}">
      ${cb.value ? `<span class="cv">${esc(cb.value)}</span>` : '<span class="cv" style="color:var(--muted)">--</span>'}
      ${cb.detail ? `<span class="cd">${esc(cb.detail)}</span>` : ''}</td>`;
    const label = edge === 'A' ? a : edge === 'B' ? b : '相當';
    return `<tr><td class="dimcol">${esc(r.dimension ?? '')}</td>${tdA}${tdB}
      <td><span class="edge${edge === 'A' || edge === 'B' ? '' : ' tie'}">${esc(label)}</span></td></tr>`;
  }).join('');

  return `<section id="sec-typed">
    ${head('逐維度比較', '在相同口徑下比較兩個幣種，相對較強的一側以底色標示', `${rows.length} 個維度`)}
    ${rows.length ? `<div class="cmp-wrap"><table class="cmp">
      <thead><tr><th scope="col">維度</th><th scope="col">${esc(a)}</th><th scope="col">${esc(b)}</th><th scope="col">相對較強</th></tr></thead>
      <tbody>${body}</tbody></table></div>` : ''}
    ${(c.when_prefer_a || c.when_prefer_b) ? `<div class="prefer">
      ${c.when_prefer_a ? `<div class="pbox"><h4><span class="sym-tag">${esc(a)}</span>在什麼條件下更值得優先關注</h4><p>${esc(c.when_prefer_a)}</p></div>` : ''}
      ${c.when_prefer_b ? `<div class="pbox"><h4><span class="sym-tag">${esc(b)}</span>在什麼條件下更值得優先關注</h4><p>${esc(c.when_prefer_b)}</p></div>` : ''}
    </div>` : ''}
  </section>`;
}

/** 多源整合題型：由 dimension state 推導跨來源一致性分組（純分類，不做數值運算） */
function secConsistency(rd) {
  const dims = Array.isArray(rd.dimensions) ? rd.dimensions : [];
  if (dims.length < 2) return '';
  const strong = dims.filter(d => d.state === 'strong');
  const weak = dims.filter(d => d.state === 'weak');
  const naDims = dims.filter(d => d.state === 'na');
  const neutral = dims.filter(d => d.state === 'neutral');

  // 同時存在偏強與偏弱維度 = 跨來源背離
  const diverge = strong.length && weak.length;

  const group = (cls, icon, title, items, note) => {
    if (!items.length) return '';
    return `<div class="cgroup ${cls}">
      <h4><span aria-hidden="true">${icon}</span>${esc(title)}<span class="n" style="font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400">　${items.length}</span></h4>
      <ul>${items.map(d => `<li><span class="dn">${esc(d.name)}</span>：${esc(d.headline || STATE[d.state] || '')}</li>`).join('')}</ul>
      ${note ? `<p style="font-size:11.5px;color:var(--muted);margin-top:.5rem;line-height:1.55">${esc(note)}</p>` : ''}
    </div>`;
  };

  return `<section id="sec-typed">
    ${head('跨來源一致性', diverge
      ? '偏強與偏弱維度同時存在，代表來源之間出現背離 — 這本身就是最有參考價值的訊號'
      : '各維度方向的一致程度')}
    <div class="consist">
      ${group('agree', '↑', '指向偏強', strong, '')}
      ${group('diverge', '↓', '指向偏弱', weak, '')}
      ${group('gap', '○', '中性', neutral, '')}
      ${group('gap', '×', '無可用資料', naDims, '這些維度嘗試過但未取得可用資料，已列入信心說明的限制')}
    </div>
  </section>`;
}

/* =========================================================================
   5. 圖表（只讀 C7 series，前端不計算任何指標）
   ========================================================================= */
function secCharts(rd) {
  if (!rd || !rd.series || typeof rd.series !== 'object') return '';
  const keys = Object.keys(rd.series).filter(k => {
    const s = rd.series[k];
    return s && typeof s === 'object' &&
      Object.values(s).some(pts => Array.isArray(pts) && pts.length > 1);
  });
  if (!keys.length) return '';

  // 價格優先，其餘依 SERIES_META 已知順序，未知的排最後
  const known = Object.keys(SERIES_META);
  keys.sort((a, b) => {
    const ia = known.indexOf(a), ib = known.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  const cards = keys.map((k, i) => {
    const meta = SERIES_META[k] || { title: k, unit: '' };
    const syms = Object.keys(rd.series[k]);
    const n = Math.max(...syms.map(s => (rd.series[k][s] || []).length));
    return `<div class="chart-card">
      <h3>${esc(meta.title)}</h3>
      <p class="cmeta">${esc(syms.join(' · '))}${meta.unit ? ` — ${esc(meta.unit)}` : ''}　近 ${n} 個資料點</p>
      <div class="chart-box"><canvas id="chart-${i}" data-key="${esc(k)}"></canvas></div>
    </div>`;
  }).join('');

  return `<section id="sec-charts">
    ${head('資料視覺化', '所有數值由後端工具決定性計算，前端僅負責呈現', `${keys.length} 張`)}
    <div class="charts">${cards}</div>
  </section>`;
}

function drawCharts(rd) {
  charts.forEach(c => { try { c.destroy(); } catch (e) { /* 已釋放 */ } });
  charts = [];
  if (!rd || !rd.series) return;
  if (typeof Chart === 'undefined') return;

  const palette = ['#f37021', '#60a5fa', '#22c55e', '#f59e0b'];

  document.querySelectorAll('#sec-charts canvas').forEach(cv => {
    const key = cv.dataset.key;
    const group = rd.series[key];
    if (!group) return;
    const meta = SERIES_META[key] || { fmt: 'auto' };

    // 以各 symbol 的日期聯集為 X 軸，缺值以 null 斷線（不內插、不臆測）
    const labelSet = new Set();
    Object.values(group).forEach(pts => {
      (Array.isArray(pts) ? pts : []).forEach(p => labelSet.add(String(p[0])));
    });
    const labels = [...labelSet].sort();
    if (labels.length < 2) return;

    const datasets = Object.entries(group).map(([sym, pts], i) => {
      const map = new Map((Array.isArray(pts) ? pts : []).map(p => [String(p[0]), num(p[1])]));
      const color = palette[i % palette.length];
      return {
        label: sym,
        data: labels.map(d => (map.has(d) ? map.get(d) : null)),
        borderColor: color,
        backgroundColor: meta.type === 'bar' ? color + '99' : color + '1f',
        borderWidth: 1.8,
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: .28,
        fill: meta.type !== 'bar' && Object.keys(group).length === 1,
        spanGaps: false,
        yAxisID: i === 1 && needsSecondAxis(group) ? 'y1' : 'y'
      };
    });

    const scales = {
      x: {
        grid: { color: 'rgba(38,38,44,.55)' },
        ticks: { color: '#71717a', font: { size: 10, family: "'IBM Plex Mono', monospace" }, maxTicksLimit: 7 }
      },
      y: {
        position: 'left',
        grid: { color: 'rgba(38,38,44,.55)' },
        ticks: {
          color: '#71717a', font: { size: 10, family: "'IBM Plex Mono', monospace" }, maxTicksLimit: 6,
          callback: v => fmt(v, meta.fmt)
        }
      }
    };
    if (datasets.some(d => d.yAxisID === 'y1')) {
      scales.y1 = {
        position: 'right',
        grid: { drawOnChartArea: false },
        ticks: {
          color: '#71717a', font: { size: 10, family: "'IBM Plex Mono', monospace" }, maxTicksLimit: 6,
          callback: v => fmt(v, meta.fmt)
        }
      };
    }

    try {
      charts.push(new Chart(cv, {
        type: meta.type === 'bar' ? 'bar' : 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 500 },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              display: datasets.length > 1,
              labels: { color: '#a1a1aa', font: { size: 11 }, boxWidth: 10, boxHeight: 10, usePointStyle: true }
            },
            tooltip: {
              backgroundColor: '#17171c',
              borderColor: '#26262c',
              borderWidth: 1,
              titleColor: '#f4f4f5',
              bodyColor: '#a1a1aa',
              padding: 9,
              callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y, meta.fmt)}` }
            }
          },
          scales
        }
      }));
    } catch (e) { /* 單一圖表失敗不影響其他區塊 */ }
  });
}

/** 兩個 symbol 數量級差距過大時改用雙 Y 軸（例如 BTC vs ETH 價格） */
function needsSecondAxis(group) {
  const maxes = Object.values(group).map(pts => {
    const vals = (Array.isArray(pts) ? pts : []).map(p => num(p[1])).filter(v => v !== null);
    return vals.length ? Math.max(...vals.map(Math.abs)) : 0;
  }).filter(v => v > 0);
  if (maxes.length < 2) return false;
  return Math.max(...maxes) / Math.min(...maxes) >= 8;
}

/* =========================================================================
   6. 推理鏈（事實 → 推論 → 結論）
   ========================================================================= */
const MD_SECTIONS = ['市場判斷', '關鍵依據', '信心說明'];

function splitReport(text) {
  const out = {};
  MD_SECTIONS.forEach(name => {
    const re = new RegExp(`(?:^|\\n)#{1,4}\\s*${name}\\s*\\n([\\s\\S]*?)(?=\\n#{1,4}\\s|$)`);
    const m = re.exec(text || '');
    if (m && m[1].trim()) out[name] = m[1].trim();
  });
  return out;
}

function secReasoning(text) {
  const s = splitReport(text);
  if (!s['關鍵依據'] && !s['市場判斷'] && !s['信心說明']) return '';

  const step = (cls, tag, title, sub, body) => body ? `<article class="rstep ${cls}">
    <div class="rstep-head">
      <span class="rstep-n">${esc(tag)}</span>
      <h3>${esc(title)}</h3>
      <span class="sub">${esc(sub)}</span>
    </div>
    <div class="prose">${linkCitations(mdToHtml(body))}</div>
  </article>` : '';

  return `<section id="sec-reasoning">
    ${head('推理鏈', '事實 → 推論 → 結論三層分離，每項事實都可回溯到 evidence_id')}
    <div class="reason">
      ${step('fact', '事實層', '關鍵依據', '資料直接顯示的數字與事件', s['關鍵依據'])}
      ${step('infer', '推論與結論層', '市場判斷', '由事實推導的邏輯與綜合判斷', s['市場判斷'])}
      ${step('calib', '校準層', '信心說明', '已知限制、矛盾訊號取捨、推翻條件', s['信心說明'])}
    </div>
  </section>`;
}

function mdToHtml(md) {
  if (!md) return '';
  try {
    if (typeof marked !== 'undefined') {
      return marked.parse(md, { breaks: true, gfm: true });
    }
  } catch (e) { /* 解析失敗改用純文字 */ }
  return `<p>${esc(md).replace(/\n/g, '<br>')}</p>`;
}

/** 把報告文字中的 ev_xxx 轉成可點擊 chip，這是可回溯性的展示重點 */
function linkCitations(html) {
  if (!html) return '';
  const ids = evidenceList.map(e => e && e.evidence_id).filter(Boolean);
  if (!ids.length) return html;
  // 依長度倒序，避免前綴互相覆蓋
  ids.sort((a, b) => b.length - a.length);
  let out = html;
  ids.forEach(id => {
    const safe = id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(safe, 'g'),
      `<button class="chip" type="button" data-ev="${esc(id)}" title="跳到證據明細">${esc(shortId(id))}</button>`);
  });
  return out;
}

/* =========================================================================
   7. 證據溯源
   ========================================================================= */
function secEvidence() {
  if (!evidenceList.length) {
    return `<section id="sec-evidence">
      ${head('證據溯源', '每筆證據含 source / fetched_at / content_reference / related_claim')}
      <div class="empty">本次未取得證據清單。若在本機執行，請確認下載連結可正常存取。</div>
    </section>`;
  }

  const rows = evidenceList.map(ev => {
    if (!ev || typeof ev !== 'object') return '';
    const ref = ev.content_reference;
    const links = verifyLinks(ref);
    const refJson = (() => {
      try { return JSON.stringify(ref, null, 2); }
      catch (e) { return String(ref ?? ''); }
    })();
    return `<article class="ev" id="ev-${esc(ev.evidence_id)}" data-blob="${esc(
      [ev.evidence_id, ev.source, ev.related_claim, refJson].join(' ').toLowerCase()
    )}">
      <div class="ev-top">
        <span class="ev-id">${esc(ev.evidence_id ?? '')}</span>
        <span class="ev-time">${esc(ev.fetched_at ?? '')}</span>
      </div>
      ${ev.related_claim ? `<p class="ev-claim">${esc(ev.related_claim)}</p>` : ''}
      <p class="ev-src"><span class="lbl">來源</span>${
        /^https?:\/\//i.test(String(ev.source ?? ''))
          ? `<a href="${esc(ev.source)}" target="_blank" rel="noopener">${esc(ev.source)}</a>`
          : esc(ev.source ?? '未知來源')
      }</p>
      ${links.length ? `<div class="ev-links"><span class="lbl" style="color:var(--muted);font-size:12px">查證</span>${
        links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a>`).join('')
      }</div>` : ''}
      <details class="ref"><summary>content_reference（查詢參數與指標數值）</summary>
        <pre>${esc(refJson)}</pre>
      </details>
    </article>`;
  }).join('');

  return `<section id="sec-evidence">
    ${head('證據溯源', '每筆證據含來源、取得時間、查詢條件與對應判斷，可逐筆查證', `${evidenceList.length} 筆`)}
    <div class="ev-tools">
      <input class="ev-search" id="ev-search" type="search" placeholder="搜尋 evidence_id、來源、對應判斷或查詢參數…" aria-label="搜尋證據">
      <span class="ev-count" id="ev-count">${evidenceList.length} / ${evidenceList.length}</span>
    </div>
    <div class="ev-list" id="ev-list">${rows}</div>
  </section>`;
}

/* =========================================================================
   8. 資料覆蓋與限制
   ========================================================================= */
function secCoverage(rd) {
  const cov = rd && rd.coverage && typeof rd.coverage === 'object' ? rd.coverage : null;
  if (!cov) return '';
  const got = Array.isArray(cov.got) ? cov.got : [];
  const missing = Array.isArray(cov.missing) ? cov.missing : [];
  if (!got.length && !missing.length && cov.pct === null) return '';

  const pct = num(cov.pct);
  const low = pct !== null && pct < 60;

  return `<section id="sec-coverage">
    ${head('資料覆蓋與限制', '這是本題相關預抓能力中「品質可用」的比例，不是報告分數也不是投資信心')}
    <div class="cov">
      <div class="cov-meter">
        <span class="cov-n${low ? ' warn' : ''}">${pct === null ? '--' : Math.round(pct)}<small>${pct === null ? '' : '%'}</small></span>
        <div class="cov-track"><i class="${low ? 'warn' : ''}" style="width:${pct === null ? 0 : Math.max(2, Math.min(100, pct))}%"></i></div>
        <p class="cl">${pct === null
          ? '本題沒有適用的預抓能力，故不計算比例'
          : `${got.length} 項可用 / ${got.length + missing.length} 項嘗試`}</p>
      </div>
      <div class="cov-lists">
        ${got.length ? `<div class="cov-col got">
          <h4><span aria-hidden="true">✓</span>成功取得<span class="n">${got.length}</span></h4>
          <ul>${got.map(g => `<li>${esc(typeof g === 'string' ? g : (g && g.capability) || '')}</li>`).join('')}</ul>
        </div>` : ''}
        ${missing.length ? `<div class="cov-col miss">
          <h4><span aria-hidden="true">!</span>未取得<span class="n">${missing.length}</span></h4>
          <ul>${missing.map(m => {
            const cap = typeof m === 'string' ? m : (m && m.capability) || '';
            const why = typeof m === 'object' && m ? m.reason : '';
            return `<li>${esc(cap)}${why ? `<span class="why">原因：${esc(why)}</span>` : ''}</li>`;
          }).join('')}</ul>
        </div>` : ''}
        ${low ? `<div class="cov-warn"><span aria-hidden="true">!</span>
          <span>資料可用率偏低（低於 60%），請留意上方判斷是在較少來源交叉驗證的情況下形成。此警示僅反映資料可得性，不會自動改寫模型結論。</span>
        </div>` : ''}
      </div>
    </div>
  </section>`;
}

/* =========================================================================
   9. 後續觀察
   ========================================================================= */
function secWatchlist(rd) {
  const wl = rd && Array.isArray(rd.watchlist) ? rd.watchlist : [];
  if (!wl.length) return '';
  return `<section id="sec-watchlist">
    ${head('後續觀察重點', '可能改變上述判斷的已知事件', `${wl.length} 項`)}
    <div class="watch">${wl.map(w => `<article class="wcard">
      ${w.date ? `<p class="wd">${esc(w.date)}</p>` : ''}
      <p class="we">${esc(w.event ?? '')}</p>
      ${w.why ? `<p class="ww">${esc(w.why)}</p>` : ''}
    </article>`).join('')}</div>
  </section>`;
}

/* =========================================================================
   10. 原始交付物
   ========================================================================= */
function secRaw(reportText, rd) {
  if (!reportText && !rd) return '';
  const words = reportText ? reportText.length.toLocaleString('zh-TW') : '0';
  return `<section id="sec-raw">
    ${head('原始交付物', '評審抽查用：完整報告、結構化資料與執行紀錄')}
    ${reportText ? `<details class="big">
      <summary>完整分析報告（report.md）<span class="sn">${words} 字元</span></summary>
      <div class="body"><div class="prose">${mdToHtml(reportText)}</div></div>
    </details>` : ''}
    <details class="big">
      <summary>執行紀錄（execution_log.jsonl）<span class="sn" id="log-n">載入中…</span></summary>
      <div class="body"><div class="logs" id="log-body"><p class="empty">載入中…</p></div></div>
    </details>
    ${rd ? `<details class="big">
      <summary>結構化報告資料（report_data.json）<span class="sn">C7 schema ${esc(rd.schema_version ?? '')}</span></summary>
      <div class="body"><pre style="font-family:var(--mono);font-size:11px;color:var(--text-dim);overflow-x:auto;white-space:pre-wrap;word-break:break-word;max-height:420px">${esc(safeJson(rd))}</pre></div>
    </details>` : ''}
  </section>`;
}

function safeJson(obj) {
  try { return JSON.stringify(obj, null, 2); }
  catch (e) { return '（無法序列化）'; }
}

/** 執行紀錄非同步載入，失敗不影響其他章節 */
async function loadLog(url) {
  const body = $('log-body'), counter = $('log-n');
  if (!body) return;
  if (!url || url === '#') {
    body.innerHTML = '<p class="empty">本次未提供執行紀錄下載連結。</p>';
    if (counter) counter.textContent = '不可用';
    return;
  }
  try {
    const res = await fetch(new URL(url, location.href));
    if (!res.ok) throw new Error(String(res.status));
    const text = await res.text();
    const steps = text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      try { return JSON.parse(l); } catch (e) { return null; }
    }).filter(Boolean);

    if (!steps.length) {
      body.innerHTML = '<p class="empty">執行紀錄為空。</p>';
      if (counter) counter.textContent = '0 筆';
      return;
    }

    const failed = steps.filter(s => s.status && s.status !== 'success').length;
    body.innerHTML = steps.map(s => {
      const ok = s.status === 'success';
      const ts = String(s.timestamp ?? s.ts ?? '').replace('T', ' ').replace('Z', '');
      return `<div class="logrow ${ok ? 'ok' : 'bad'}">
        <span class="lt">${esc(ts.slice(0, 19))}</span>
        <span class="ls">${esc(s.status ?? '')}</span>
        <span class="ln">${esc(s.tool_name ?? '')}</span>
        <span class="lms">${s.elapsed_ms !== undefined ? esc(s.elapsed_ms) + 'ms' : ''}</span>
        ${s.note ? `<span class="lnote">${esc(s.note)}</span>` : ''}
      </div>`;
    }).join('');
    if (counter) counter.textContent = `${steps.length} 筆${failed ? `・${failed} 筆失敗` : ''}`;
  } catch (e) {
    body.innerHTML = '<p class="empty">執行紀錄載入失敗，可改用上方下載連結取得。</p>';
    if (counter) counter.textContent = '載入失敗';
  }
}

/* =========================================================================
   互動綁定
   ========================================================================= */
/** 點擊 evidence chip → 捲動到該筆證據並高亮 */
function bindChips() {
  document.querySelectorAll('.chip[data-ev]').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      const target = $(`ev-${btn.dataset.ev}`);
      if (!target) return;
      document.querySelectorAll('.ev.hit').forEach(e => e.classList.remove('hit'));
      const search = $('ev-search');
      if (search && search.value) { search.value = ''; filterEvidence(''); }
      target.classList.add('hit');
      const detail = target.querySelector('details.ref');
      if (detail) detail.open = true;
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });
}

function bindEvidenceSearch() {
  const input = $('ev-search');
  if (!input) return;
  input.addEventListener('input', () => filterEvidence(input.value));
}

function filterEvidence(term) {
  const q = String(term ?? '').trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('#ev-list .ev').forEach(el => {
    const hit = !q || (el.dataset.blob || '').includes(q);
    el.hidden = !hit;
    if (hit) shown++;
  });
  const counter = $('ev-count');
  if (counter) counter.textContent = `${shown} / ${evidenceList.length}`;
}

/** 捲動時高亮當前章節導覽 */
function observeNav(ids) {
  const links = new Map();
  document.querySelectorAll('#topnav a').forEach(a => {
    links.set(a.getAttribute('href').slice(1), a);
  });
  if (!('IntersectionObserver' in window)) return;
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const a = links.get(en.target.id);
      if (!a) return;
      if (en.isIntersecting) {
        links.forEach(l => l.classList.remove('on'));
        a.classList.add('on');
      }
    });
  }, { rootMargin: '-100px 0px -65% 0px' });
  ids.forEach(id => { const el = $(id); if (el) obs.observe(el); });
}

initInput();
