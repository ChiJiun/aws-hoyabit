<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加密市場分析 AI Agent — HOYA BIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --ink:#09090b;--surface:#131316;--card:#1a1a1f;--line:#27272a;
  --text:#f4f4f5;--muted:#71717a;--accent:#f37021;
  --accent-glow:rgba(243,112,33,0.45);--accent-dim:rgba(243,112,33,0.12);
  --green:#22c55e;--red:#ef4444;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:16px;line-height:1.75;min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{opacity:.85}

/* ===== HEADER ===== */
.dash-header{padding:1rem 1.5rem;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.dash-header .brand{display:flex;align-items:center;gap:.6rem}
.dash-header .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
.dash-header .brand-name{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.1em;color:var(--accent)}
.dash-header .meta{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-align:right}
.dash-header .meta span{display:block}

/* ===== INPUT ===== */
.input-section{max-width:680px;margin:2.5rem auto;padding:0 1rem}
.input-section h1{font-size:26px;font-weight:700;margin-bottom:.3rem}
.input-section .sub{font-size:15px;color:var(--muted);margin-bottom:1.8rem}
.form-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem}
.form-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem}
.coins{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.coin{font-family:'IBM Plex Mono',monospace;font-size:14px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:.4rem 1rem;cursor:pointer;transition:.15s}
.coin:hover{border-color:var(--muted)}
.coin[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#000;font-weight:500}
textarea{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.75rem 1rem;font-family:inherit;font-size:16px;resize:vertical;min-height:100px;margin-bottom:1.5rem}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.btn-submit{width:100%;background:var(--accent);color:#000;border:none;border-radius:var(--radius-sm);padding:.75rem;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s}
.btn-submit:hover{filter:brightness(1.1)}.btn-submit:disabled{opacity:.4;cursor:not-allowed}

/* ===== LOADING ===== */
#loading{display:none;text-align:center;padding:5rem 2rem}
.spinner{width:28px;height:28px;margin:0 auto 1rem;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{color:var(--muted);font-size:14px}
.elapsed{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:13px;margin-top:.5rem}
#error{display:none;max-width:680px;margin:1.5rem auto;padding:1rem 1.2rem;border:1px solid #7f1d1d;border-radius:var(--radius-sm);background:#1c1012;color:#fca5a5;font-size:14px}

/* ===== DASHBOARD ===== */
#dashboard{display:none}
.dash-grid{max-width:1400px;margin:0 auto;padding:1.5rem 1rem}
/* Hero row */
.top-row{display:grid;grid-template-columns:1.8fr 1fr;gap:1rem;margin-bottom:1rem}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem 2rem;position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;top:-40%;right:-20%;width:260px;height:260px;background:radial-gradient(circle,var(--accent-dim) 0%,transparent 70%);pointer-events:none}
.hero-card .hero-topic{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:.5rem;letter-spacing:.05em}
.hero-card h2{font-size:24px;font-weight:700;color:#fff;margin-bottom:1rem;line-height:1.4}
.conclusion-box{border:2px solid var(--accent);border-radius:var(--radius-sm);padding:1.2rem 1.5rem;background:var(--card);box-shadow:0 0 24px var(--accent-glow),0 0 64px var(--accent-dim);animation:pulse 3.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 24px var(--accent-glow),0 0 64px var(--accent-dim)}50%{box-shadow:0 0 36px var(--accent-glow),0 0 90px var(--accent-glow)}}
.conclusion-box p{font-size:19px;font-weight:600;color:#fff}
.data-cards{display:flex;flex-direction:column;gap:.75rem}
.data-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1rem 1.3rem;flex:1;display:flex;flex-direction:column;justify-content:center}
.data-card .dc-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
.data-card .dc-value{font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.data-card .dc-value.up{color:var(--accent)}.data-card .dc-value.down{color:var(--red)}

/* Confidence gauge */
.conf-gauge{display:flex;align-items:center;gap:1rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm)}
.conf-ring{position:relative;width:64px;height:64px;flex-shrink:0}
.conf-ring svg{transform:rotate(-90deg)}
.conf-ring .ring-bg{stroke:var(--line);fill:none;stroke-width:6}
.conf-ring .ring-fg{stroke:var(--accent);fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.conf-ring .ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent);font-family:'IBM Plex Mono',monospace}
.conf-gauge .conf-label{font-size:13px;color:var(--muted)}

/* Radar row */
.radar-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem}
.radar-row h3{font-size:18px;font-weight:700;margin-bottom:1.2rem;color:#fff}
.radar-flex{display:flex;align-items:flex-start;justify-content:center;gap:2rem;flex-wrap:wrap}
.radar-wrap{width:280px;height:280px;flex-shrink:0}
.radar-wrap canvas{width:100%;height:100%}
.radar-notes{max-width:400px;flex:1}
.warn-pill{display:flex;align-items:flex-start;gap:.5rem;background:var(--card);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:.6rem .8rem;margin-bottom:.5rem;font-size:14px;line-height:1.6;color:var(--text)}
.warn-pill .wi{color:var(--accent);flex-shrink:0;font-size:15px}
/* Contradiction panel */
.contradiction-panel{background:var(--card);border:1px solid var(--red);border-radius:var(--radius-sm);padding:.9rem 1rem;margin-top:.6rem;position:relative}
.contradiction-panel .cp-title{font-size:13px;font-weight:600;color:var(--red);margin-bottom:.55rem;display:flex;align-items:center;gap:.4rem}
.contradiction-panel .cp-item{font-size:14px;color:var(--text);margin-bottom:.45rem;padding:.55rem .7rem .55rem 1.9rem;position:relative;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;transition:border-color .2s,transform .2s}
.contradiction-panel .cp-item:hover,.contradiction-panel .cp-item:focus{border-color:var(--accent);transform:translateX(3px);outline:none}
.contradiction-panel .cp-item::before{content:'⚡';position:absolute;left:.65rem;color:var(--accent)}
.contradiction-panel .cp-link{display:block;color:var(--muted);font-size:10px;margin-top:.2rem;font-family:'IBM Plex Mono',monospace}
.ev-item.dim-highlight{border-color:var(--accent);box-shadow:0 0 18px var(--accent-dim);animation:cardIn .25s ease}
.ev-item.dim-muted{opacity:.42}

/* Evidence split */
.evidence-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem}
.evidence-row h3{font-size:18px;font-weight:700;margin-bottom:1rem;color:#fff}
.split{display:grid;grid-template-columns:1fr minmax(300px,420px);gap:1rem;min-height:400px}

/* Left: report with timeline cards */
.report-col{background:var(--card);border-radius:var(--radius-sm);padding:1.5rem;overflow-y:auto;max-height:650px;line-height:1.8;font-size:16px}
.report-col h1,.report-col h2,.report-col h3{margin:1.5rem 0 .7rem;font-weight:700;color:#fff}
.report-col h1{font-size:22px}.report-col h2{font-size:19px}.report-col h3{font-size:17px}
.report-col p{margin-bottom:.8rem}
/* Timeline evidence items */
.ev-item{display:flex;gap:.8rem;padding:.8rem;margin-bottom:.6rem;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);transition:border-color .2s}
.ev-item:hover{border-color:var(--accent)}
.ev-item .ev-icon{width:36px;height:36px;border-radius:8px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.ev-item .ev-body{flex:1;min-width:0}
.ev-item .ev-body .ev-text{font-size:15px;line-height:1.6;margin-bottom:.4rem}
.ev-item .ev-footer{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
/* Cite button */
.cite-btn{display:inline-flex;align-items:center;gap:.25rem;background:var(--accent);color:#000;padding:.15rem .5rem;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;position:relative;transition:filter .15s}
.cite-btn:hover{filter:brightness(1.15)}
.cite-btn .cite-icon{font-size:12px}
/* Cite tooltip */
.cite-btn::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#222;color:var(--text);font-size:11px;line-height:1.4;padding:.4rem .6rem;border-radius:6px;white-space:normal;min-width:200px;max-width:280px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:100;border:1px solid var(--accent);text-align:left;font-weight:400}
.cite-btn:hover::after{opacity:1}
/* Data badge */
.data-badge{display:inline-flex;align-items:center;gap:.25rem;background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.12rem .55rem;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--accent);font-weight:500;white-space:nowrap;vertical-align:middle;margin:.12rem .08rem}
.data-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.data-badge.state-positive{color:var(--green);border-color:rgba(34,197,94,.38);background:rgba(34,197,94,.07)}
.data-badge.state-negative{color:var(--red);border-color:rgba(239,68,68,.38);background:rgba(239,68,68,.07)}
.data-badge.state-warning{color:#f59e0b;border-color:rgba(245,158,11,.38);background:rgba(245,158,11,.07)}
.data-badge .badge-state{color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-size:10px}
/* Signal arrow */
.signal-arrow{font-size:16px;font-weight:700;margin-left:auto;flex-shrink:0}
.signal-arrow.bullish{color:var(--green)}
.signal-arrow.bearish{color:var(--red)}
.signal-arrow.neutral{color:var(--muted)}

/* Right: evidence viz panel */
.ev-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1.2rem;transition:border-color .25s;position:sticky;top:1rem;align-self:start;max-height:600px;overflow-y:auto}
.ev-panel.show{border-color:var(--accent)}
.ev-panel .ep-hint{font-size:13px;color:var(--muted)}
.ev-panel .ev-loading{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:13px;padding:.5rem 0}
.ev-panel .ev-loading .mini-spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
/* Evidence card */
.ev-card{background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius-sm);padding:1.2rem;margin-bottom:.8rem;animation:cardIn .28s ease,pulse 3.5s ease-in-out infinite;box-shadow:0 0 24px var(--accent-glow),0 0 64px var(--accent-dim)}
@keyframes cardIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.ev-card .ec-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ev-card .ec-source-name{font-size:14px;font-weight:600;color:var(--accent)}
.ev-card .ec-source-link{display:inline-flex;align-items:center;gap:.2rem;font-size:11px;color:var(--muted);margin-left:auto}
.ev-card .ec-source-link:hover{color:var(--accent)}
.ev-card .ec-source-link svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.ev-card .ec-field{margin-bottom:.5rem;font-size:13px;line-height:1.5}
.ev-card .ec-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:.2rem}
/* Viz: sentiment donut */
.sentiment-viz{display:flex;align-items:center;gap:1rem;margin:.6rem 0}
.sentiment-viz canvas{width:80px;height:80px}
.sentiment-viz .sv-legend{font-size:12px;line-height:1.6}
.sentiment-viz .sv-legend .sv-pos{color:var(--green)}.sentiment-viz .sv-legend .sv-neg{color:var(--red)}.sentiment-viz .sv-legend .sv-neu{color:var(--muted)}
.sv-headline{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:.4rem}
/* Viz: gauge meter */
.gauge-viz{margin:.6rem 0}
.gauge-bar{height:8px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.gauge-bar .gauge-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .6s ease}
.gauge-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:.2rem}
.gauge-value{font-size:16px;font-weight:700;color:var(--accent);font-family:'IBM Plex Mono',monospace;margin-bottom:.3rem}
/* Generic evidence visualizations */
.viz-section{margin:.7rem 0;padding:.75rem;background:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm)}
.viz-title{display:flex;align-items:center;justify-content:space-between;gap:.5rem;color:#fff;font-size:13px;font-weight:600;margin-bottom:.6rem}
.viz-sub{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.metric-tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.55rem;min-width:0}
.metric-tile .mt-label{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-tile .mt-value{display:block;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.metric-tile .mt-state{display:block;color:var(--muted);font-size:10px;margin-top:.1rem}
.compare-row{display:grid;grid-template-columns:minmax(75px,.8fr) 2fr minmax(58px,.6fr);gap:.5rem;align-items:center;margin:.45rem 0;font-size:11px}
.compare-row .cr-label{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compare-track{height:8px;background:var(--line);border-radius:999px;overflow:hidden;display:flex}
.compare-fill{height:100%;background:var(--accent);border-radius:999px;min-width:2px}
.compare-fill.alt{background:var(--muted)}
.compare-value{text-align:right;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:10px}
.range-viz{margin:.65rem 0}
.range-head{display:flex;justify-content:space-between;gap:.5rem;font-size:11px;margin-bottom:.25rem}.range-head span:first-child{color:var(--text)}.range-head span:last-child{color:var(--accent);font-family:'IBM Plex Mono',monospace}
.range-track{height:7px;background:var(--line);border-radius:999px;position:relative}.range-marker{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);transform:translate(-50%,-50%)}.range-average{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.range-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:.2rem;font-family:'IBM Plex Mono',monospace}
.evidence-list{list-style:none}.evidence-list li{padding:.55rem 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.45}.evidence-list li:last-child{border-bottom:none}.evidence-list a{color:var(--text)}.evidence-list a:hover{color:var(--accent)}.list-meta{display:flex;gap:.45rem;flex-wrap:wrap;color:var(--muted);font-size:9px;margin-top:.2rem;font-family:'IBM Plex Mono',monospace}
.availability-note{border-left:3px solid var(--accent);background:var(--accent-dim);padding:.65rem .75rem;border-radius:0 6px 6px 0;font-size:12px;color:var(--text);line-height:1.55;margin:.6rem 0}.availability-note strong{display:block;color:var(--accent);font-size:11px}.availability-note .trace-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}.trace-tag{border:1px solid var(--line);border-radius:4px;padding:.08rem .35rem;color:var(--muted);font-size:9px;font-family:'IBM Plex Mono',monospace}
.series-canvas{width:100%;height:120px;display:block}.source-count{display:inline-flex;align-items:center;gap:.3rem;color:var(--muted);font-size:10px}.source-count b{color:var(--accent)}
.conf-tier{display:block;color:var(--text);font-size:14px;font-weight:600}.conf-basis{display:block;color:var(--muted);font-size:10px;margin-top:.08rem}

/* Download */
.dl-footer{display:flex;gap:.75rem;flex-wrap:wrap;padding:.5rem 1rem 2rem;max-width:1400px;margin:0 auto}
.dl-btn{font-size:14px;color:var(--text);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.5rem 1rem;background:var(--surface);transition:border-color .15s,color .15s;display:inline-flex;align-items:center;gap:.4rem}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}
.dl-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* Responsive */
@media(min-width:1200px){.dash-grid{padding:1.5rem 2rem}.split{grid-template-columns:1fr 420px}}
@media(max-width:768px){.top-row,.split{grid-template-columns:1fr}.ev-panel{position:static;max-height:none}.radar-flex{flex-direction:column;align-items:center}.dash-grid,.dl-footer{padding-left:.75rem;padding-right:.75rem}.dash-header{padding:.75rem 1rem}.hero-card,.radar-row,.evidence-row{padding:1rem}.report-col{max-height:none}}
@media(prefers-reduced-motion:reduce){.spinner,.conclusion-box,.mini-spin{animation:none}}
</style>
</head>
<body>
<!-- HEADER -->
<header class="dash-header" id="dash-header" style="display:none">
  <div class="brand"><span class="brand-dot"></span><span class="brand-name">HOYA BIT AGENT</span></div>
  <div class="meta"><span id="hdr-run-id"></span><span id="hdr-time"></span></div>
</header>
<!-- INPUT -->
<section class="input-section" id="input-section">
  <h1>加密市場分析 AI Agent</h1>
  <p class="sub">輸入幣種與分析題目，Agent 將自主蒐集多源資料並產出可回溯的結構化報告。</p>
  <div class="form-panel">
    <p class="form-label">幣種選擇（比較題可選兩個）</p>
    <div class="coins" id="coins">
      <button class="coin" aria-pressed="false">BTC</button>
      <button class="coin" aria-pressed="false">ETH</button>
      <button class="coin" aria-pressed="false">SOL</button>
      <button class="coin" aria-pressed="false">BNB</button>
      <button class="coin" aria-pressed="false">XRP</button>
    </div>
    <p class="form-label">分析題目</p>
    <textarea id="question" placeholder="例：請分析 BTC 近期是否處於高波動蓄勢階段，並從價格、鏈上、新聞多角度提供證據支持你的判斷。"></textarea>
    <button class="btn-submit" id="submit">開始分析</button>
  </div>
</section>
<!-- LOADING BAR (bottom fixed) -->
<div id="loading" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:.7rem 1.5rem;align-items:center;gap:.8rem;z-index:999">
  <span class="spinner" style="width:16px;height:16px;margin:0;flex-shrink:0"></span>
  <span id="loading-msg" style="font-size:14px;color:var(--muted)">正在規劃資料蒐集範圍</span>
  <span id="elapsed" style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent)">00:00</span>
</div>
<div id="error"></div>
<!-- DASHBOARD -->
<div id="dashboard">
<div class="dash-grid">
  <div class="top-row">
    <div class="hero-card">
      <p class="hero-topic" id="hero-topic"></p>
      <h2 id="hero-title"></h2>
      <div class="conclusion-box"><p id="hero-conclusion"></p></div>
    </div>
    <div class="data-cards" id="data-cards">

function toNumber(value){if(typeof value==='number')return Number.isFinite(value)?value:null;if(typeof value!=='string')return null;const n=Number(value.replace(/[$,%\s,]/g,''));return Number.isFinite(n)?n:null}
function compactNumber(value){const n=toNumber(value);if(n===null)return String(value??'--');return new Intl.NumberFormat('zh-TW',{notation:Math.abs(n)>=1000?'compact':'standard',maximumFractionDigits:2}).format(n)}
function metricLabel(key){if(METRIC_META[key])return METRIC_META[key].label;return String(key).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function formatMetricValue(key,value){
  if(value===null||value===undefined||value==='')return'--';
  const raw=String(value),n=toNumber(value),format=METRIC_META[key]?.format||'auto';
  if(n===null)return raw.length>30?raw.slice(0,27)+'…':raw;
  if(raw.includes('%')&&['auto','number'].includes(format))return raw;
  if(format==='usd')return'$'+compactNumber(n);
  if(format==='compact')return compactNumber(n);
  if(format==='signedCompact')return(n>0?'+':'')+compactNumber(n);
  if(format==='integer')return Math.round(n).toLocaleString('zh-TW');
  if(format==='percent')return n.toFixed(Math.abs(n)<10?2:1).replace(/\.0+$/,'')+'%';
  if(format==='signedPercent')return(n>0?'+':'')+n.toFixed(2).replace(/\.00$/,'')+'%';
  if(format==='ratioPercent'){const p=Math.abs(n)<=1?n*100:n;return(n>0?'+':'')+p.toFixed(4).replace(/0+$/,'').replace(/\.$/,'')+'%'}
  if(format==='ratio')return n.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  if(format==='signed')return(n>0?'+':'')+n.toFixed(1).replace(/\.0$/,'');
  return n.toLocaleString('zh-TW',{maximumFractionDigits:4});
}
function metricState(key,value,extra={}){
  const n=toNumber(value);if(n===null)return{label:'',cls:''};
  if(key==='rsi_14')return n>=70?{label:'超買區',cls:'warning'}:n<=30?{label:'超賣區',cls:'warning'}:{label:'中性',cls:''};
  if(key==='adx')return n>=25?{label:'趨勢明顯',cls:'positive'}:{label:'趨勢偏弱',cls:''};
  if(key==='funding_rate')return n>0?{label:'多頭付費',cls:'warning'}:n<0?{label:'空頭付費',cls:'positive'}:{label:'資金平衡',cls:''};
  if(['long_short_ratio','taker_buy_sell_ratio'].includes(key))return n>1.05?{label:'偏多',cls:'positive'}:n<.95?{label:'偏空',cls:'negative'}:{label:'平衡',cls:''};
  if(key==='put_call_ratio')return n>1?{label:'防禦偏高',cls:'warning'}:n<.7?{label:'偏多預期',cls:'positive'}:{label:'中性',cls:''};
  if(['current_index','current_value'].includes(key))return n>=75?{label:'極度貪婪',cls:'warning'}:n>=55?{label:'貪婪',cls:'warning'}:n<=25?{label:'極度恐慌',cls:'negative'}:n<=45?{label:'恐慌',cls:'negative'}:{label:'中性',cls:''};
  if(['value_change','stablecoin_7d_change_pct','net_speculative'].includes(key))return n>0?{label:'上升',cls:'positive'}:n<0?{label:'下降',cls:'negative'}:{label:'持平',cls:''};
  if(extra.percentile!==undefined&&extra.percentile!==null){const p=toNumber(extra.percentile);return p>=80?{label:`歷史 P${Math.round(p)} 高位`,cls:'warning'}:p<=20?{label:`歷史 P${Math.round(p)} 低位`,cls:'warning'}:{label:`歷史 P${Math.round(p)}`,cls:''}}
  return{label:'',cls:''};
}
function collectMetricEntries(cr){
  if(!cr||typeof cr!=='object'||Array.isArray(cr))return[];
  const result=[],seen=new Set();
  const push=(key,value,extra={})=>{if(value===null||value===undefined||typeof value==='object'||seen.has(key))return;if(!METRIC_META[key]&&!extra.force)return;seen.add(key);result.push({key,label:extra.label||metricLabel(key),value,formatted:formatMetricValue(key,value),percentile:extra.percentile,range:extra.range,state:metricState(key,value,extra)})};
  Object.entries(cr).forEach(([key,value])=>push(key,value));
  Object.entries(cr.indicators||{}).forEach(([key,item])=>{if(item&&typeof item==='object')push(key,item.value,{percentile:item.percentile,force:true})});
  Object.entries(cr.indicators_summary||{}).forEach(([key,item])=>{if(item&&typeof item==='object'){push(key,item.latest_value,{label:metricLabel(key),force:true});push(`${key}_change_pct`,item.change_pct,{label:`${metricLabel(key)} 期間變化`,force:true})}});
  Object.entries(cr.metric_values||{}).forEach(([key,item])=>{if(item&&typeof item==='object')push(key,item.latest,{label:metricLabel(key),range:{min:item.min_30d,max:item.max_30d,avg:item.avg_30d},force:true})});
  Object.entries(cr.dominance||{}).sort((a,b)=>(toNumber(b[1])||0)-(toNumber(a[1])||0)).slice(0,4).forEach(([key,value])=>push(`${key}_dominance`,value,{label:`${key.toUpperCase()} 市佔`,force:true}));
  return result;
}
function normalizeEvidenceReference(cr,ev={}){

  let kind='trace';
  if(Array.isArray(ref.items))kind='news';else if(ref.current_index!==undefined||ref.current_value!==undefined&&ref.classification)kind='sentiment';else if(ref.indicators)kind='quant';else if(ref.indicators_summary)kind='macro';else if(ref.metric_values)kind='coinmetrics';else if(Array.isArray(ref.events))kind='prediction';else if(Array.isArray(ref.top_filings))kind='sec';else if(ref.chain_tvl_breakdown||ref.total_tvl_usd!==undefined)kind='defi';else if(ref.repo||ref.commit_count_4w!==undefined)kind='github';else if(ref.net_speculative!==undefined||ref.noncommercial_long!==undefined)kind='cftc';else if(ref.funding_rate!==undefined||ref.put_call_ratio!==undefined||ref.dvol!==undefined)kind='derivatives';else if(ref.bid_depth_2pct!==undefined)kind='orderbook';else if(ref.dominance)kind='dominance';else if(ref.positive_pct!==undefined)kind='sentimentDistribution';else if(ref.bollinger_bandwidth!==undefined||ref.rsi_14!==undefined)kind='technical';else if(Array.isArray(ref.series)||Array.isArray(ref.observations))kind='series';
  return{kind,ref,metrics:collectMetricEntries(ref),trace:Object.entries(ref).filter(([key,value])=>TRACE_KEYS.has(key)&&value!==null&&value!==undefined)};
}

async function loadEvidenceList(data){
  if(Array.isArray(data.evidence_list))return data.evidence_list;
  const downloadUrl=data.evidence_download_url;
  if(!downloadUrl||downloadUrl==='#')return [];
  document.getElementById('loading-msg').textContent='正在載入證據清單並建立圖表';
  const response=await fetch(new URL(downloadUrl,window.location.href));
  if(!response.ok)throw new Error(`分析已完成，但證據清單載入失敗 (${response.status})`);
  const payload=await response.json();
  if(!Array.isArray(payload))throw new Error('證據清單格式錯誤，無法建立圖表');
  return payload;
}

function fillMetrics(t){
  const pm=t.match(/\$\s*([\d,\.]+)/)||t.match(/價格[^$\d]{0,10}\$?([\d,\.]+)/i);
  document.getElementById('dc-price').textContent=pm?'$'+pm[1]:'--';
  const chm=t.match(/([\+\-]?\d+\.?\d*)\s*%/);
  const chEl=document.getElementById('dc-change');
  if(chm){const v=parseFloat(chm[1]);chEl.textContent=(v>=0?'+':'')+v.toFixed(2)+'%';chEl.className='dc-value '+(v>=0?'up':'down')}
  else{chEl.textContent='--';chEl.className='dc-value'}
}

function confidenceTier(pct){if(pct>=80)return{label:'高信心',color:'var(--green)'};if(pct>=65)return{label:'中高信心',color:'var(--accent)'};if(pct>=45)return{label:'中等信心',color:'#f59e0b'};return{label:'低信心',color:'var(--red)'}}
function renderConfGauge(report,scores){
  const reported=report.match(/信心[^\d]{0,8}(\d+)/)||report.match(/confidence[：:]\s*(\d+)/i);
  const evidencePct=evidenceList.length?Math.round(scores.reduce((sum,value)=>sum+value,0)/scores.length):null;
  const pct=Math.max(0,Math.min(100,evidencePct??(reported?parseInt(reported[1]):0)));
  const tier=confidenceTier(pct),circ=175.9;
  document.getElementById('conf-ring-fg').style.strokeDashoffset=circ-(circ*pct/100);

function evidenceDimension(ev){
  const normalized=normalizeEvidenceReference(ev?.content_reference,ev),kind=normalized.kind;
  if(['quant','derivatives','orderbook','dominance','technical','series'].includes(kind))return'price';
  if(['coinmetrics','defi','github'].includes(kind))return'chain';
  if(kind==='news')return'news';
  if(['macro','cftc','sec'].includes(kind))return'macro';
  if(['sentiment','sentimentDistribution','prediction'].includes(kind))return'sentiment';
  const text=`${ev?.source||''} ${ev?.related_claim||''}`.toLowerCase();
  if(/binance|coingecko|ohlcv|price|quant|technical|deribit|hyperliquid|價格|技術|衍生品/.test(text))return'price';
  if(/mempool|etherscan|blockscout|helius|xrpl|onchain|defi|chain|鏈上/.test(text))return'chain';
  if(/news|rss|cryptopanic|coindesk|新聞|公告/.test(text))return'news';
  if(/fred|macro|stlouisfed|cftc|sec|總經|利率|監管|機構/.test(text))return'macro';
  if(/alternative\.me|fear|greed|sentiment|polymarket|社群|情緒|預測/.test(text))return'sentiment';
  return'other';
}
function referenceCompleteness(cr){
  if(!cr||typeof cr!=='object'||Array.isArray(cr)||!Object.keys(cr).length)return 0;
  const normalized=normalizeEvidenceReference(cr),keys=Object.keys(cr);
  const trace=normalized.trace.length?Math.min(1,normalized.trace.length/2):0;
  const metrics=normalized.metrics.length?Math.min(1,normalized.metrics.length/3):0;
  const lists=['items','events','top_filings'].some(key=>Array.isArray(cr[key])&&cr[key].length)||Object.keys(cr.metric_values||{}).length||Object.keys(cr.chain_tvl_breakdown||{}).length?1:0;
  const scalar=Math.min(1,keys.filter(key=>cr[key]!==null&&typeof cr[key]!=='object').length/4);
  return Math.min(1,trace*.3+metrics*.35+lists*.2+scalar*.15);
}
function evidenceFreshness(value){
  const ts=Date.parse(value||'');if(!Number.isFinite(ts))return .3;
  const age=Math.max(0,(Date.now()-ts)/86400000);
  if(age<=1)return 1;if(age<=7)return .85;if(age<=30)return .65;if(age<=90)return .45;return .25;
}
function calcConfidence(){
  const dimensions=['price','chain','news','macro','sentiment'];
  return dimensions.map(dimension=>{
    const records=evidenceList.filter(ev=>evidenceDimension(ev)===dimension);
    if(!records.length)return 10;
    const quality=records.reduce((sum,ev)=>sum+referenceCompleteness(ev.content_reference),0)/records.length;
    const freshness=records.reduce((sum,ev)=>sum+evidenceFreshness(ev.fetched_at),0)/records.length;
    const sources=new Set(records.map(ev=>getSourceName(ev.source))).size;
    return Math.round(Math.min(95,12+Math.min(25,records.length*8)+quality*38+freshness*15+Math.min(10,sources*3)));
  });
}
function drawRadar(scores){
  const cv=document.getElementById('radar-canvas'),ctx=cv.getContext('2d');
  const cx=140,cy=140,R=100,n=5,labels=['價格走勢','鏈上活躍度','新聞情緒','總經政策','社群熱度'];
  ctx.clearRect(0,0,280,280);
  for(let lv=1;lv<=4;lv++){ctx.beginPath();const r=R*lv/4;for(let i=0;i<=n;i++){const a=Math.PI*2*i/n-Math.PI/2;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.stroke()}
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.stroke()}
  ctx.beginPath();for(let i=0;i<=n;i++){const idx=i%n;const a=Math.PI*2*idx/n-Math.PI/2;const v=scores[idx]/100;const x=cx+R*v*Math.cos(a),y=cy+R*v*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fillStyle='rgba(243,112,33,0.3)';ctx.fill();ctx.strokeStyle='rgba(243,112,33,0.85)';ctx.lineWidth=2;ctx.stroke();
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n-Math.PI/2;const v=scores[i]/100;const x=cx+R*v*Math.cos(a),y=cy+R*v*Math.sin(a);ctx.beginPath();ctx.arc(x,y,scores[i]>75?5:3,0,Math.PI*2);ctx.fillStyle=scores[i]>75?'#f37021':'rgba(243,112,33,0.55)';ctx.fill();const lx=cx+(R+18)*Math.cos(a),ly=cy+(R+18)*Math.sin(a);ctx.font='12px Noto Sans TC';ctx.fillStyle='#a1a1aa';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(labels[i],lx,ly)}
}
function inferDimensionFromText(text){
  const value=String(text||'').toLowerCase(),matches=[];
  if(/價格|技術|波動|rsi|布林|成交量|多空|資金費率|衍生品/.test(value))matches.push('price');
  if(/鏈上|巨鯨|地址|交易所餘額|tvl|穩定幣|協議/.test(value))matches.push('chain');
  if(/新聞|公告|媒體|消息|etf/.test(value))matches.push('news');
  if(/總經|利率|美元|dxy|公債|fed|cpi|監管|機構/.test(value))matches.push('macro');
  if(/情緒|社群|恐慌|貪婪|預測市場|fear|greed/.test(value))matches.push('sentiment');
  return matches.length?matches.join(','):'other';
}
function fillWarnings(scores,report){
  const labels=['價格走勢','鏈上活躍度','新聞品質','總經政策','市場情緒'];
  const box=document.getElementById('radar-notes');box.innerHTML='';

  const low=labels.filter((_,i)=>scores[i]<45),high=labels.filter((_,i)=>scores[i]>=75);

  const contraMatch=report.match(/\*{0,2}矛盾信號[：:]?\*{0,2}[：:]?([\s\S]*?)(?=\n#{1,3}\s|\n\*\*[^*]+[：:]?\*\*|$)/i);
  if(contraMatch){

    if(items.length){let html='<div class="contradiction-panel"><div class="cp-title">⚠️ 矛盾信號交叉檢視</div>';items.forEach(item=>{const dimension=inferDimensionFromText(item);html+=`<div class="cp-item" role="button" tabindex="0" data-dimension="${dimension}">${escapeHtml(item)}<span class="cp-link">依文字關鍵詞連動 · 點擊聚焦相關證據</span></div>`});html+='</div>';box.innerHTML+=html}
  }

function renderQuant(ref,metrics){
  if(!metrics.length)return renderTraceNote(normalizeEvidenceReference(ref));
  return `<div class="viz-section"><div class="viz-title"><span>${escapeHtml(ref.symbol||'')} 技術指標</span><span class="viz-sub">${escapeHtml(ref.window||'--')} 日視窗</span></div>${metrics.map(metric=>{const p=toNumber(metric.percentile),position=p===null?Math.max(0,Math.min(100,toNumber(metric.value)||0)):Math.max(0,Math.min(100,p));return `<div class="range-viz"><div class="range-head"><span>${escapeHtml(metric.label)}</span><span>${escapeHtml(metric.formatted)}${p===null?'':` · P${Math.round(p)}`}</span></div><div class="range-track"><span class="range-marker" style="left:${position}%"></span></div><div class="range-labels"><span>${p===null?'低':'P0'}</span><span>${escapeHtml(metric.state.label||'歷史位置')}</span><span>${p===null?'高':'P100'}</span></div></div>`}).join('')}</div>`;
}
function renderMacro(ref,metrics){
  const entries=Object.entries(ref.indicators_summary||{});
  if(!entries.length)return renderTraceNote(normalizeEvidenceReference(ref));
  return `<div class="viz-section"><div class="viz-title"><span>FRED 總經指標</span><span class="viz-sub">${escapeHtml(ref.query_range||'')}</span></div>${entries.map(([key,item])=>{const change=toNumber(item.change_pct),width=Math.min(100,Math.abs(change||0)*10);return `<div class="range-viz"><div class="range-head"><span>${escapeHtml(metricLabel(key))} · ${escapeHtml(item.series_id||'')}</span><span>${escapeHtml(item.latest_value)} (${change>0?'+':''}${escapeHtml(item.change_pct)}%)</span></div><div class="compare-track"><span class="compare-fill ${change<0?'alt':''}" style="width:${Math.max(2,width)}%"></span></div><div class="range-labels"><span>${escapeHtml(item.latest_date||'')}</span><span>期間變化</span></div></div>`}).join('')}${ref.upcoming_events_count!==undefined?`<div class="availability-note"><strong>未來 30 天排定事件</strong>${escapeHtml(ref.upcoming_events_count)} 筆；事件明細保存在 raw payload。</div>`:''}</div>`;
}
function renderPrediction(ref){
  const events=Array.isArray(ref.events)?ref.events.slice(0,8):[];
  if(!events.length)return renderTraceNote(normalizeEvidenceReference(ref),'未找到可顯示的預測市場事件；不以缺值推估市場機率。');
  return `<div class="viz-section"><div class="viz-title"><span>預測市場機率</span><span class="viz-sub">市場定價，非事實機率</span></div>${events.map(event=>{let probability=toNumber(event.outcome_price);if(probability===null)probability=0;if(probability<=1)probability*=100;probability=Math.max(0,Math.min(100,probability));return `<div class="range-viz"><div class="range-head"><span>${escapeHtml(event.title||event.slug||'未命名事件')}</span><span>${probability.toFixed(1)}%</span></div><div class="range-track"><span class="compare-fill" style="display:block;width:${probability}%"></span></div><div class="range-labels"><span>成交量 ${escapeHtml(compactNumber(event.volume_usd||0))}</span><span>流動性 ${escapeHtml(compactNumber(event.liquidity_usd||0))}</span></div></div>`}).join('')}</div>`;
}
function renderFilings(ref){
  const filings=Array.isArray(ref.top_filings)?ref.top_filings.slice(0,8):[];
  if(!filings.length)return renderTraceNote(normalizeEvidenceReference(ref));
  return `<div class="viz-section"><div class="viz-title"><span>SEC 文件</span><span class="source-count"><b>${escapeHtml(ref.total_filings??filings.length)}</b> 筆</span></div><ul class="evidence-list">${filings.map(item=>`<li>${escapeHtml(item.title||item.entity_name||'未命名文件')}<div class="list-meta"><span>${escapeHtml(item.form_type||'')}</span><span>${escapeHtml(item.file_date||'')}</span><span>${escapeHtml(item.entity_name||'')}</span></div></li>`).join('')}</ul></div>`;
}
function objectBarRows(object){
  return Object.entries(object||{}).map(([label,value])=>({label,value:typeof value==='object'?(value.tvl??value.value??value.total??0):value,formatted:typeof value==='object'?compactNumber(value.tvl??value.value??value.total??0):compactNumber(value)})).sort((a,b)=>(toNumber(b.value)||0)-(toNumber(a.value)||0)).slice(0,8);
}
function renderGenericFields(ref){
  const fields=Object.entries(ref).filter(([key,value])=>!TRACE_KEYS.has(key)&&value!==null&&value!==undefined&&typeof value!=='object').slice(0,8);
  if(!fields.length)return'';
  return `<div class="viz-section"><div class="viz-title"><span>引用欄位</span></div><div class="metric-grid">${fields.map(([key,value])=>`<div class="metric-tile"><span class="mt-label">${escapeHtml(metricLabel(key))}</span><span class="mt-value">${escapeHtml(String(value).slice(0,40))}</span></div>`).join('')}</div></div>`;
}
function renderContentViz(normalized){
  const {kind,ref,metrics}=normalized;
  if(kind==='news')return renderNewsItems(ref);
  if(kind==='sentiment')return renderSentiment(ref);
  if(kind==='sentimentDistribution')return `<div class="viz-section"><div class="viz-title"><span>情緒分佈</span><span class="viz-sub">來源明示比例</span></div><div class="sentiment-viz"><canvas id="sent-donut" width="80" height="80"></canvas><div class="sv-legend"><span class="sv-pos">● 正面 ${escapeHtml(ref.positive_pct)}%</span><br><span class="sv-neu">● 中性 ${escapeHtml(ref.neutral_pct||0)}%</span><br><span class="sv-neg">● 負面 ${escapeHtml(ref.negative_pct||0)}%</span></div></div>${ref.top_headline?`<div class="sv-headline">「${escapeHtml(ref.top_headline)}」</div>`:''}</div>`;
  if(kind==='quant')return renderQuant(ref,metrics);
  if(kind==='macro')return renderMacro(ref,metrics);
  if(kind==='coinmetrics')return renderMetricGrid(metrics,'Coin Metrics 鏈上數據')+renderRangeMetrics(metrics,'30 日分布位置');
  if(kind==='prediction')return renderPrediction(ref);
  if(kind==='sec')return renderFilings(ref);
  if(kind==='defi')return renderMetricGrid(metrics,'DeFi 與穩定幣')+renderCompareRows(objectBarRows(ref.chain_tvl_breakdown),'各鏈 TVL 分布');
  if(kind==='github')return renderMetricGrid(metrics,'開發活動')+`<div class="availability-note"><strong>${escapeHtml(ref.repo||'GitHub repository')}</strong>最新版本 ${escapeHtml(ref.latest_release_tag||'未提供')} · ${escapeHtml(ref.latest_release_date||'日期未提供')} ${ref.latest_release_name?`· ${escapeHtml(ref.latest_release_name)}`:''}</div>`;
  if(kind==='cftc')return renderMetricGrid(metrics,'CFTC 部位摘要')+renderCompareRows([{label:'投機多單',value:ref.noncommercial_long},{label:'投機空單',value:ref.noncommercial_short},{label:'商業多單',value:ref.commercial_long},{label:'商業空單',value:ref.commercial_short}],'多空部位比較');
  if(kind==='derivatives')return renderMetricGrid(metrics,'衍生品市場')+renderCompareRows([{label:'多頭帳戶',value:ref.long_account},{label:'空頭帳戶',value:ref.short_account},{label:'Put OI',value:ref.put_oi},{label:'Call OI',value:ref.call_oi}].filter(row=>row.value!==undefined),'市場結構比較');
  if(kind==='orderbook')return renderMetricGrid(metrics,'現貨盤口')+renderCompareRows([{label:'買方 ±2%',value:ref.bid_depth_2pct},{label:'賣方 ±2%',value:ref.ask_depth_2pct}],'盤口深度比較');
  if(kind==='dominance')return renderMetricGrid(metrics,'市場概覽')+renderCompareRows(objectBarRows(ref.dominance).map(row=>({...row,formatted:`${toNumber(row.value)?.toFixed(1)}%`})),'主要資產市佔');
  if(kind==='technical')return renderMetricGrid(metrics,'技術指標')+renderTraceNote(normalized,'content_reference 提供指標快照但未提供 OHLCV 序列，因此不繪製價格線或布林帶時序。');
  if(kind==='series')return renderMetricGrid(metrics,'序列摘要')+'<div class="viz-section"><div class="viz-title"><span>實際資料序列</span></div><canvas id="series-line" class="series-canvas" width="340" height="120"></canvas></div>';
  const generic=renderMetricGrid(metrics)+renderGenericFields(ref);
  return generic+renderTraceNote(normalized,generic?'可視化數值如上；其餘 metadata 用於重現查詢。':'此證據只提供查詢 metadata，未提供可安全繪製的時序或數值。');
}
function extractSeries(ref){
  const sequence=Array.isArray(ref.series)?ref.series:Array.isArray(ref.observations)?ref.observations:[];
  return sequence.map((item,index)=>{if(typeof item==='number')return{x:index,y:item};if(Array.isArray(item))return{x:item[0],y:toNumber(item[1])};if(item&&typeof item==='object')return{x:item.date||item.timestamp||index,y:toNumber(item.close??item.value??item.latest)};return{x:index,y:null}}).filter(point=>point.y!==null);
}
function drawSeries(canvas,points){
  if(!canvas||points.length<2)return;
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,pad=14,values=points.map(point=>point.y),min=Math.min(...values),max=Math.max(...values),span=max-min||1;
  ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;for(let i=1;i<4;i++){const y=pad+(h-pad*2)*i/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}
  ctx.beginPath();points.forEach((point,index)=>{const x=pad+(w-pad*2)*index/(points.length-1),y=h-pad-(point.y-min)/span*(h-pad*2);index?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#f37021';ctx.lineWidth=2;ctx.stroke();
}
function renderInlineCharts(panel,normalized){
  const ref=normalized.ref,donut=panel.querySelector('#sent-donut');
  if(donut&&ref.positive_pct!==undefined){const ctx=donut.getContext('2d'),data=[toNumber(ref.positive_pct)||0,toNumber(ref.neutral_pct)||0,toNumber(ref.negative_pct)||0],total=data.reduce((sum,value)=>sum+value,0)||100,colors=['#22c55e','#71717a','#ef4444'];let start=-Math.PI/2;data.forEach((value,index)=>{const angle=Math.PI*2*value/total;ctx.beginPath();ctx.moveTo(40,40);ctx.arc(40,40,35,start,start+angle);ctx.fillStyle=colors[index];ctx.fill();start+=angle});ctx.beginPath();ctx.arc(40,40,20,0,Math.PI*2);ctx.fillStyle='#1a1a1f';ctx.fill()}
  const line=panel.querySelector('#series-line');if(line)drawSeries(line,extractSeries(ref));
}
</script>
</body>
